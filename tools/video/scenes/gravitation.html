<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#070b18;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Бүкіләлемдік тартылыс заңы. Жасанды серіктер» (9-сынып): Ньютон зеңбірегі — таудың басынан горизонталь атылған снаряд
// жылдамдығы артқан сайын алысырақ түседі; υ = 7,9 км/с (бірінші ғарыштық жылдамдық) болғанда Жерді айналып ұшады
// (дөңгелек орбита), одан үлкен болса — эллипс. Траекториялар F = GMm/r² бойынша сандық есептеледі; күш Жер центріне бағытталған.
import { THREE, V, stage, orbit, readout, arrow, label, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: false, bg: '#070b18', fog: [400, 500] }), { scene, camera, renderer } = st;
camera.far = 300; camera.updateProjectionMatrix(); renderer.shadowMap.enabled = false;
scene.traverse((o) => { if (o.isLight) o.intensity = o.isHemisphereLight ? 0.5 : o.intensity * 0.9; });
let sd = 7; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
{ const p = []; for (let i = 0; i < 1200; i++) { const u = rnd() * 2 - 1, f = rnd() * Math.PI * 2, r = 120; p.push(r * Math.sqrt(1 - u * u) * Math.cos(f), r * u, r * Math.sqrt(1 - u * u) * Math.sin(f)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#cfd8ff', size: 1.5, sizeAttenuation: false }))); }
const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 512;
{ const x = ec.getContext('2d'); x.fillStyle = '#1d5fb8'; x.fillRect(0, 0, 1024, 512);
  for (const [bx, by, br] of [[160, 170, 110], [230, 330, 80], [520, 160, 120], [560, 300, 90], [760, 190, 140], [830, 360, 70]]) for (let i = 0; i < 26; i++) { const a = rnd() * 6.28, d = rnd() * br, r = br * (0.25 + rnd() * 0.35); x.fillStyle = rnd() < 0.7 ? '#3f8f3a' : '#b49a5a'; x.beginPath(); x.ellipse(bx + Math.cos(a) * d, by + Math.sin(a) * d * 0.7, r, r * 0.7, rnd() * 3, 0, Math.PI * 2); x.fill(); }
  x.fillStyle = '#f2f6fb'; x.fillRect(0, 0, 1024, 30); x.fillRect(0, 482, 1024, 30); }
const tex = new THREE.CanvasTexture(ec); tex.colorSpace = THREE.SRGBColorSpace;
const RE = 1.0, earth = mesh(new THREE.SphereGeometry(RE, 64, 48), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 }), { parent: scene, shadow: false });
// тау (солтүстік полюсте, y осінде)
const HM = 0.18, mt = mesh(new THREE.ConeGeometry(0.16, HM + 0.04, 24), new THREE.MeshStandardMaterial({ color: '#8a7a64', roughness: 0.9 }), { parent: scene, pos: [0, RE + HM / 2 - 0.01, 0], shadow: false });
mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.07, 12), mat.dark, { parent: scene, pos: [0.02, RE + HM + 0.01, 0], rot: [0, 0, -Math.PI / 2], shadow: false });
const R0 = RE + HM + 0.02, VC = Math.sqrt(1 / R0); // GM = 1
const SH = [0.45, 0.7, 0.85, 1.0, 1.13].map((k) => { // υ/υ₁
  const pts = []; let p = V(0, R0, 0), v = V(VC * k, 0, 0); const dt = 0.002;
  for (let i = 0; i < 9000; i++) { const r = p.length(); if (r < RE + 0.005 && i > 5) break; const a = p.clone().multiplyScalar(-1 / r ** 3); v.addScaledVector(a, dt); p.addScaledVector(v, dt); if (i % 4 === 0) pts.push(p.clone()); if (k >= 1 && i > 50 && p.distanceTo(V(0, R0, 0)) < 0.01) break; }
  const g = new THREE.BufferGeometry().setFromPoints(pts), l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: k < 1 ? '#ffb020' : k === 1 ? '#17d07a' : '#4fb6ff', transparent: true })); scene.add(l);
  const ball = mesh(new THREE.SphereGeometry(0.025, 16, 12), new THREE.MeshBasicMaterial({ color: '#ffffff' }), { parent: scene, shadow: false });
  return { k, pts, l, ball }; });
const SCH = [[1.0, 2.6], [3.0, 4.8], [5.2, 7.2], [7.6, 12.2], [12.6, 17.0]]; // әр снарядтың уақыты
const rv = readout(scene, { color: '#17a05d', w: 0.8 });
const aF = arrow(scene, '#e5483a', { r: 0.014 }), lF = label(scene, 'F', '', '#ff6a5a', { size: 0.26 });

window.renderFrame = (t) => {
  earth.rotation.y = t * 0.05;
  SH.forEach((s, i) => { const [a, b] = SCH[i], k = Math.min(1, Math.max(0, (t - a) / (b - a))), n = Math.max(1, Math.floor(s.pts.length * k));
    s.l.geometry.setDrawRange(0, n); s.l.visible = t > a; s.l.material.opacity = t > b + 0.4 ? 0.55 : 1; s.ball.visible = t > a && t < b + 0.3; s.ball.position.copy(s.pts[n - 1]); });
  // күш: ағымдағы снарядта Жер центріне қарай
  const cur = SH.findIndex((s, i) => t > SCH[i][0] && t < SCH[i][1]); const fo = cur >= 3 ? 1 : 0;
  if (cur >= 0) { const p = SH[cur].ball.position; aF.set(p, p.clone().multiplyScalar(-1).normalize(), 0.28, fo); lF.show(p.clone().multiplyScalar(0.8).add(V(0.08, 0, 0)), fo); } else { aF.set(V(), V(0, 1, 0), 0, 0); lF.show(V(), 0); }
  const vs = ['3,6', '5,5', '6,7', '7,9', '8,9'][Math.max(0, cur)];
  rv.set(vs + ' км/с', cur >= 0 ? win(t, SCH[cur][0] - 0.2, SCH[cur][0] + 0.2, SCH[cur][1] - 0.2, SCH[cur][1] + 0.2) : 0); const rad = lerp(3.2, 5.6, seg(t, 6.6, 8.4)), f = rad / 3.2; rv.scale.set(0.8 * f, 0.25 * f, 1); rv.position.set(lerp(0, 2.2, seg(t, 6.6, 8.4)), lerp(R0 + 0.45, 1.4, seg(t, 6.6, 8.4)), 0);
  orbit(camera, t, { ang: 0.0, swing: 0.15, rad, y: lerp(1.7, 0.8, seg(t, 6.6, 8.4)), look: [0, lerp(1.0, 0.1, seg(t, 6.6, 8.4)), 0] });
  return st.render();
};
ready();
</script>
</body></html>

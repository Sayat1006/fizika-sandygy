<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Қатты денелердің балқуы және қатаюы» (8-сынып): −20 °C мұзды тұрақты қуатпен қыздырады. Мұз 0 °C-қа дейін қызады
// (c_мұз = 2100), сосын балқу кезінде температура тұрақты (λ = 330 кДж/кг), барлығы еріген соң су қызады (c = 4200).
// Уақыттар Q = cmΔt және Q = λm бойынша: 2100·20 : 330000 : 4200·20 ≈ 1 : 7,9 : 2.
import { THREE, V, stage, orbit, readout, beaker, thermometer, hotplate, hudPlot, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [3.6, 2.2] }), { scene, camera, hud } = st;
const X = -0.35, hp = hotplate(scene, { x: X, w: 0.6 });
const bk = beaker(scene, { r: 0.26, h: 0.5, x: X, y: hp.top, color: '#4aa3ef', op: 0.5 });
const th = thermometer(scene, { min: -30, max: 60, len: 0.7, every: 10, x: X + 0.12, y: hp.top + 0.03, z: -0.12 }); th.rotation.z = -0.14;
const iceM = new THREE.MeshPhysicalMaterial({ color: '#e6f4ff', transparent: true, opacity: 0.82, roughness: 0.15, transmission: 0 });
let sd = 4; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
const ICE = [];
for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2 + rnd(), r = i < 7 ? 0.13 : 0.03, s = 0.085 + rnd() * 0.02;
  const m = mesh(new THREE.BoxGeometry(s, s, s), iceM, { parent: scene }); m.userData = { x: X + Math.cos(a) * r, z: Math.sin(a) * r, y: hp.top + s / 2 + 0.01 + (i >= 7 ? s : 0), s, rot: [rnd(), rnd() * 3, rnd()], d: rnd() * 0.25 }; ICE.push(m); }
// уақыт кестесі (с): t1 — 0 °C-қа жетеді, t2 — мұз түгел ериді, t3 — соңы
const TS = 1.6, U = (16.6 - TS) / (1 + 7.9 + 2), t1 = TS + U, t2 = t1 + 7.9 * U, t3 = t2 + 2 * U;
const Tof = (t) => t < TS ? -20 : t < t1 ? -20 + 20 * (t - TS) / U : t < t2 ? 0 : Math.min(20, 20 * (t - t2) / (2 * U));
const melt = (t) => Math.min(1, Math.max(0, (t - t1) / (t2 - t1)));
const ro = readout(scene, { color: '#1f6fd0', w: 0.56 });
const plot = hudPlot(hud, { x: 900, y: 370, w: 340, h: 290, ax: ['τ', ''], ay: ['t', ''] });

window.renderFrame = (t) => {
  hp.set(seg(t, 0.6, 1.6));
  const T = Tof(t), m = melt(t); th.set(T);
  ro.set((T < 0 ? '−' : '') + Math.abs(Math.round(T)) + ' °C', win(t, 0.5, 1.0, 17.3, 17.9)); ro.position.set(X, 1.12, 0.1);
  ICE.forEach((c) => { const u = c.userData, k = Math.max(0, 1 - Math.max(0, (m - u.d * 0.6)) / (1 - u.d * 0.6)); c.scale.setScalar(Math.max(0.001, k)); c.visible = k > 0.02;
    const lvl = bk.position.y + 0.3 * m; c.position.set(u.x, Math.max(u.y - (1 - k) * u.s * 0.5, m > 0.25 ? lvl - u.s * k * 0.3 : 0), u.z); c.rotation.set(...u.rot); });
  bk.setLevel(0.27 * m + (m > 0 ? 0.01 : 0));
  // график: AB — мұз қызады, BC — балқу, CD — су қызады
  const pts = []; for (let k = 0; k <= 60; k++) { const tt = TS + (16.6 - TS) * k / 60; if (tt > t) break; pts.push([0.04 + 0.9 * k / 60, (Tof(tt) + 30) / 60]); }
  plot.draw([{ pts, color: '#1f6fd0', label: t > 16.6 ? '' : '' }], seg(t, 0.6, 1.2));
  orbit(camera, t, { ang: -0.15, swing: 0.2, rad: 2.6, y: 1.3, look: [-0.05, 0.45, 0] });
  return st.render();
};
ready();
</script>
</body></html>

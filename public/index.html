<style>
/* Layout: one calm screen — text left, atom right; a single three-step line beneath. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.nav { position: static; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 0; }
.nav .wrap { height: 64px; }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--fg-2); font: 600 12px var(--text); padding: 5px 10px; border-radius: 999px; cursor: pointer; min-height: 28px; transition: background .2s var(--ease), color .2s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

.hero { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: clamp(16px, 4vw, 56px); padding-block: clamp(24px, 5vh, 64px); }
.hero .txt { display: grid; gap: 18px; justify-items: start; min-width: 0; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: clamp(15px, 1.3vw, 17px); }
h1 { font-size: clamp(42px, 6.6vw, 84px); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; }
.sub { color: var(--fg-2); font-size: clamp(18px, 1.7vw, 22px); line-height: 1.4; max-width: 30ch; }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; margin-top: 10px; }
.pill.lg { font-size: 17px; padding: 13px 26px; min-height: 50px; }
.more { font-size: 17px; display: inline-flex; align-items: center; gap: 4px; min-height: 48px; }
.more::after { content: "›"; font-size: 1.2em; line-height: 1; transition: transform .2s var(--ease); }
.more:hover { text-decoration: none; }
.more:hover::after { transform: translateX(3px); }
.free { font-size: 14px; color: var(--fg-3); }

.stage { position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 520px; justify-self: center; }
#atom { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.atom-fallback { position: absolute; inset: 0; display: grid; place-items: center; }
.atom-fallback svg { width: 70%; height: auto; color: var(--fg-3); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; border-top: 1px solid var(--line); padding-block: 28px 8px; margin-bottom: clamp(24px, 4vh, 48px); }
.step { display: grid; gap: 4px; align-content: start; }
.step .n { font: 700 13px var(--display); color: var(--accent); }
.step b { font: 700 18px var(--display); letter-spacing: -0.01em; }
.step span { color: var(--fg-2); font-size: 15px; }

footer .wrap a { color: var(--fg-2); }
footer .wrap > span:last-child { display: flex; flex-wrap: wrap; gap: 4px; }

.rise { animation: rise .6s var(--ease) both; }
.rise.d1 { animation-delay: .06s; } .rise.d2 { animation-delay: .12s; } .rise.d3 { animation-delay: .18s; }
@keyframes rise { from { opacity: .35; transform: translateY(12px); } to { opacity: 1; transform: none; } }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; text-align: center; padding-top: 8px; }
  .hero .txt { justify-items: center; order: 2; }
  .sub { margin-inline: auto; }
  .cta { justify-content: center; }
  .stage { order: 1; max-width: 260px; }
  .steps { grid-template-columns: 1fr; gap: 18px; text-align: left; }
}
</style>
<script defer src="/_vercel/insights/script.js"></script>

<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.2v12.6c3.2-1.5 6.1-1.5 9 .9 2.9-2.4 5.8-2.4 9-.9V6.2c-3.2-1.5-6.1-1.5-9 .9-2.9-2.4-5.8-2.4-9-.9z"/><path d="M12 7.1v12.6"/></svg>
      Сабақтас
    </a>
    <div class="right">
      <div class="seg" role="group" aria-label="Тіл / Язык">
        <button id="lang-kk" type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
        <button id="lang-ru" type="button" data-lang="ru" aria-pressed="false">РУС</button>
      </div>
      <a class="pill sm" href="/app" data-i="login"></a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="txt">
      <p class="eyebrow rise" data-i="eyebrow"></p>
      <h1 class="rise d1" data-i="h1"></h1>
      <p class="sub rise d2" data-i="sub"></p>
      <div class="cta rise d3">
        <a class="pill lg" href="/samples" data-i="cta"></a>
        <a class="more" href="/app" data-i="signup"></a>
      </div>
      <p class="free" data-i="free"></p>
    </div>
    <div class="stage" aria-hidden="true">
      <canvas id="atom"></canvas>
      <div class="atom-fallback" id="atom-fallback" hidden>
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="100" cy="100" rx="88" ry="32"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(60 100 100)"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(120 100 100)"/><circle cx="100" cy="100" r="14" fill="var(--accent)" stroke="none"/></svg>
      </div>
    </div>
  </section>

  <section class="steps" aria-label="Қалай жұмыс істейді">
    <div class="step"><span class="n">1</span><b data-i="s1"></b><span data-i="s1p"></span></div>

  </section>
</main>

<footer><div class="wrap"><span>© 2026 Сабақтас</span><span><span data-i="ask"></span> <a id="wa-link" target="_blank" rel="noopener">WhatsApp</a> · <a id="tg-link" target="_blank" rel="noopener">Telegram</a> · <a href="/oferta">Оферта</a> · <a href="/privacy">Құпиялылық</a></span></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="/assets/config.js"></script>
<script>
const C = window.FS_CONFIG;
const T = {
  kk: {
    login: 'Кіру', eyebrow: 'Физика · 7–11-сынып',
    h1: 'Әр аптаның сабағы дайын.',
    sub: 'ҚМЖ, презентация және жұмыс парағы апта сайын бір жерде.',
    cta: 'Тегін үлгіні көру', signup: 'Тіркелу · 7 күн тегін', free: 'Үлгіні көру үшін тіркелу қажет емес.',
    s1: 'Үлгіні көріңіз', s1p: 'Әр сыныптың бір сабағы тегін.',
    s2: 'Сыныпқа жазылыңыз', s2p: (m, y) => `Айына ${m} немесе жылына ${y}.`,
    s3: 'Апта сайын жүктеңіз', s3p: 'Осы аптаның сабақтары кабинетте ашылады.',
    ask: 'Сұрақ болса:'
  },
  ru: {
    login: 'Войти', eyebrow: 'Физика · 7–11 классы',
    h1: 'Урок на каждую неделю готов.',
    sub: 'ҚМЖ, презентация и рабочий лист каждую неделю в одном месте.',
    cta: 'Смотреть бесплатный образец', signup: 'Регистрация · 7 дней бесплатно', free: 'Для просмотра образца регистрация не нужна.',
    s1: 'Посмотрите образец', s1p: 'Один урок каждого класса бесплатно.',
    s2: 'Подпишитесь на класс', s2p: (m, y) => `${m} в месяц или ${y} в год.`,
    s3: 'Скачивайте каждую неделю', s3p: 'Уроки текущей недели открываются в кабинете.',
    ask: 'Вопросы:'
  }
};
let lang = 'kk';
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU').replace(/ /g, ' ') + ' ₸';
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { const v = t[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  $('s2p').textContent = t.s2p(fmt(C.prices.month), fmt(C.prices.year));
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('wa-link').href = 'https://wa.me/' + C.whatsapp; $('tg-link').href = 'https://t.me/' + C.telegram;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (b) { lang = b.dataset.lang; try { localStorage.setItem('fs-lang', lang); } catch (_) {} render(); }
});
try { const l = localStorage.getItem('fs-lang'); if (l === 'ru' || l === 'kk') lang = l; } catch (_) {}
render();

window.addEventListener('load', function () {
  const canvas = $('atom'), fb = $('atom-fallback');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let renderer;
  try { if (!window.THREE) throw 0; renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
  catch (_) { canvas.hidden = true; fb.hidden = false; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, innerWidth < 700 ? 1.5 : 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 100); cam.position.set(0, 0, 10.5);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c4d6, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(4, 6, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9ccaff, 0.5); rim.position.set(-6, -2, -4); scene.add(rim);
  const group = new THREE.Group(); scene.add(group);
  group.add(new THREE.Mesh(new THREE.SphereGeometry(0.62, 64, 64), new THREE.MeshPhysicalMaterial({ color: 0x0071e3, roughness: 0.18, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.12 })));
  const ringMat = new THREE.MeshPhysicalMaterial({ color: 0xc9cdd6, roughness: 0.25, metalness: 0.6, transparent: true, opacity: 0.85 });
  const eMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1, clearcoat: 1, emissive: 0x0a2a55, emissiveIntensity: 0.25 });
  const R = 2.7, orbits = [];
  for (let i = 0; i < 3; i++) {
    const pivot = new THREE.Group(); pivot.rotation.order = 'ZYX'; pivot.rotation.z = i * Math.PI / 3; pivot.rotation.x = 1.25;
    pivot.add(new THREE.Mesh(new THREE.TorusGeometry(R, 0.022, 16, 200), ringMat));
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), eMat); pivot.add(e); group.add(pivot);
    orbits.push({ e, phase: i * 2.1, speed: 0.55 + i * 0.12 });
  }
  group.rotation.set(0.25, -0.35, 0);
  function size() { const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  size(); addEventListener('resize', size);
  let tx = 0, ty = 0, mx = 0, my = 0;
  addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - 0.5) * 0.4; ty = (e.clientY / innerHeight - 0.5) * 0.3; }, { passive: true });
  let visible = true, running = false, last = performance.now(), t = 0;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && !running) { last = performance.now(); loop(); } }).observe(canvas);
  function frame(dt) {
    t += dt;
    orbits.forEach(o => { const a = o.phase + t * o.speed; o.e.position.set(Math.cos(a) * R, Math.sin(a) * R, 0); });
    mx += (tx - mx) * 0.05; my += (ty - my) * 0.05;
    group.rotation.y = -0.35 + t * 0.12 + mx; group.rotation.x = 0.25 + my; group.position.y = Math.sin(t * 0.8) * 0.08;
    renderer.render(scene, cam);
  }
  function loop() { if (!visible || reduce) { running = false; return; } running = true; const now = performance.now(); frame(Math.min((now - last) / 1000, 0.05)); last = now; requestAnimationFrame(loop); }
  frame(0.6); if (!reduce) loop();
});
</script>

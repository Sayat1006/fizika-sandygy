<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Меншікті жылу сыйымдылығы» (8-сынып): массасы бірдей су (c = 4200 Дж/(кг·°C)) мен өсімдік майы (c ≈ 1700 Дж/(кг·°C))
// бірдей плиталарда бірдей уақыт қыздырылады (Q бірдей). Δt = Q / (cm): май шамамен 2,5 есе көп қызады. t(τ) графигі.
import { THREE, V, stage, orbit, readout, beaker, thermometer, hotplate, hudPlot, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [4.0, 2.2] }), { scene, camera, hud } = st;
const T0 = 20, TA = 2.0, TB = 15.5, DW = 22, DO = DW * 4200 / 1700; // су +22 °C, май +54 °C
const S = [{ x: -0.85, col: '#2f8fe0', lv: 0.36, dT: DW, c: '#1f6fd0', lab: 'I' }, { x: 0.45, col: '#e8b33d', lv: 0.4, dT: DO, c: '#d08a12', lab: 'II' }];
for (const s of S) {
  s.hp = hotplate(scene, { x: s.x, w: 0.56 });
  s.b = beaker(scene, { r: 0.23, h: 0.52, x: s.x, y: s.hp.top, color: s.col, op: 0.55 }); s.b.setLevel(s.lv);
  s.th = thermometer(scene, { min: 0, max: 100, len: 0.66, x: s.x + 0.1, y: s.hp.top + 0.05, z: -0.1 }); s.th.rotation.z = -0.13;
  s.ro = readout(scene, { color: s.c, w: 0.52 });
}
const plot = hudPlot(hud, { x: 940, y: 390, w: 310, h: 270, ax: ['τ', ''], ay: ['t', ''] });
const TofU = (s, t) => T0 + s.dT * seg(t, TA, TB) ** 1 * 1;
const lin = (t) => Math.min(1, Math.max(0, (t - TA) / (TB - TA)));

window.renderFrame = (t) => {
  for (const s of S) {
    s.hp.set(seg(t, 0.8, 1.8));
    const T = T0 + s.dT * lin(t); s.th.set(T); s.ro.set(Math.round(T) + ' °C', win(t, 0.8, 1.3, 17.3, 17.9)); s.ro.position.set(s.x, 1.05, 0.1);
    s.b.setLevel(s.lv * (1 + 0.0007 * (T - T0)));
  }
  const pts = (s) => { const a = []; for (let k = 0; k <= 30; k++) { const tt = TA + (TB - TA) * k / 30; if (tt > t) break; a.push([0.05 + 0.88 * k / 30, (T0 + s.dT * lin(tt)) / 85]); } return a; };
  const done = t > TB - 0.5;
  plot.draw(S.map((s) => ({ pts: t > TA ? [[0.05, T0 / 85], ...pts(s)] : [], color: s.c, label: done ? s.lab : '' })), seg(t, 0.8, 1.4));
  orbit(camera, t, { ang: -0.12, swing: 0.18, rad: 3.1, y: 1.3, look: [0.22, 0.5, 0] });
  return st.render();
};
ready();
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Импульстің сақталу заңы. Реактивті қозғалыс» (9-сынып): 1) массалары бірдей арбалардың серпімді соқтығысы — бірінші
// тоқтайды, екіншісі сол жылдамдықпен кетеді; 2) серпімсіз соқтығыс (жабысады) — бірге υ/2 жылдамдықпен; импульс бағандары
// p = mυ соқтығысқа дейін және кейін тең. 3) Зымыран: газ төмен ағады, зымыран жоғары — mυ = m_г·υ_г (бастапқы импульс 0).
import { THREE, V, stage, orbit, arrow, label, hudBars, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [4.4, 2.2] }), { scene, camera, hud } = st;
const cart = (col, z) => { const g = new THREE.Group(); scene.add(g); mesh(new THREE.BoxGeometry(0.26, 0.08, 0.17), new THREE.MeshStandardMaterial({ color: col, roughness: 0.5 }), { parent: g, pos: [0, 0.075, 0] });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.02, 14), mat.dark, { parent: g, pos: [sx * 0.09, 0.035, sz * 0.075], rot: [Math.PI / 2, 0, 0] }); g.position.z = z; return g; };
const Z = 0.0; mesh(new THREE.BoxGeometry(3.4, 0.02, 0.24), new THREE.MeshStandardMaterial({ color: '#e9edf2', roughness: 0.6 }), { parent: scene, pos: [-0.2, 0.01, Z] });
const A = cart('#1f6fd0', Z), B = cart('#e5683a', Z);
const velcro = mesh(new THREE.BoxGeometry(0.02, 0.06, 0.12), new THREE.MeshStandardMaterial({ color: '#2b2f38' }), { parent: B, pos: [-0.14, 0.075, 0] });
const bars = hudBars(hud, { x: 980, y: 400, w: 260, h: 260 });
const aA = arrow(scene, '#17a05d', { r: 0.012 }), aB = arrow(scene, '#17a05d', { r: 0.012 }), lA = label(scene, 'υ', '', '#17a05d', { size: 0.22 }), lB = label(scene, 'υ', '', '#17a05d', { size: 0.22 });
// зымыран
const RX = 1.35; const rocket = new THREE.Group(); scene.add(rocket);
mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.36, 24), new THREE.MeshStandardMaterial({ color: '#f4f6f9', roughness: 0.4 }), { parent: rocket, pos: [0, 0.18, 0] });
mesh(new THREE.ConeGeometry(0.06, 0.14, 24), new THREE.MeshStandardMaterial({ color: '#e5322d' }), { parent: rocket, pos: [0, 0.43, 0] });
for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; mesh(new THREE.BoxGeometry(0.01, 0.1, 0.07), new THREE.MeshStandardMaterial({ color: '#e5322d' }), { parent: rocket, pos: [Math.cos(a) * 0.07, 0.05, Math.sin(a) * 0.07], rot: [0, -a, 0] }); }
mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.04, 24), mat.dark, { parent: scene, pos: [RX, 0.02, -0.0] });
const NG = 70, gas = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffb347', transparent: true, opacity: 0.75 }), NG); scene.add(gas);
let sd = 5; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647); const GP = Array.from({ length: NG }, () => [rnd(), rnd() * 6.28, rnd()]);
const aR = arrow(scene, '#1f6fd0', { r: 0.016 }), aG = arrow(scene, '#e5483a', { r: 0.016 }), lR = label(scene, 'mυ', '', '#1f6fd0', { size: 0.26 }), lG = label(scene, 'm', 'г', '#e5483a', { size: 0.26 });
const dm = new THREE.Object3D();
const V0 = 0.5;

window.renderFrame = (t) => {
  // 1) серпімді: 0,8–6 с; 2) серпімсіз: 6,4–11,5 с
  let xA, xB, vA, vB, phase = t < 6.2 ? 1 : 2;
  if (phase === 1) { const tc = 0.8 + 1.0 / V0; xA = Math.min(-1.55 + V0 * Math.max(0, t - 0.8), -0.55); vA = t > 0.8 && t < tc ? V0 : 0; xB = -0.29 + (t > tc ? V0 * (t - tc) : 0); vB = t > tc ? V0 : 0; velcro.visible = false; }
  else { const t0 = 6.6, tc = t0 + 1.0 / V0; const u = Math.max(0, t - t0); velcro.visible = true;
    if (t < tc) { xA = -1.55 + V0 * u; vA = t > t0 ? V0 : 0; xB = -0.29; vB = 0; } else { xA = -0.57 + V0 / 2 * (t - tc); xB = xA + 0.28; vA = vB = V0 / 2; } }
  A.position.x = xA; B.position.x = Math.min(xB, 1.0);
  const o = win(t, 0.6, 1.0, 11.6, 12.0) * (t > 6.0 && t < 6.6 ? 0 : 1);
  aA.set(V(xA, 0.2, Z), V(1, 0, 0), vA * 0.5, o * (vA > 0 ? 1 : 0)); aB.set(V(Math.min(xB, 1.0), 0.2, Z), V(1, 0, 0), vB * 0.5, o * (vB > 0 ? 1 : 0));
  lA.show(V(xA + vA * 0.25, 0.3, Z), o * (vA > 0 ? 1 : 0)); lB.show(V(Math.min(xB, 1.0) + vB * 0.25, 0.3, Z), o * (vB > 0 ? 1 : 0));
  bars.draw([{ v: vA / V0 * 0.8, color: '#1f6fd0', label: 'p', sub: '1' }, { v: vB / V0 * 0.8, color: '#e5683a', label: 'p', sub: '2' }, { v: (vA + vB) / V0 * 0.8, color: '#17a05d', label: 'p', sub: '' }], o);
  // 3) зымыран 12,2 с-тан
  const u = Math.max(0, t - 12.4), y = 0.06 * u * u; rocket.position.set(RX, 0.04 + y, 0); const fire = t > 12.2 && t < 17.6;
  GP.forEach(([ph, a, r], i) => { const s = (ph + t * 1.6) % 1; dm.position.set(RX + Math.cos(a) * r * 0.08 * (1 + s * 2), rocket.position.y - s * 0.5, Math.sin(a) * r * 0.08 * (1 + s * 2)); dm.scale.setScalar(fire ? 0.02 + 0.03 * s : 0.0001); dm.updateMatrix(); gas.setMatrixAt(i, dm.matrix); });
  gas.instanceMatrix.needsUpdate = true;
  const ro = win(t, 12.8, 13.2, 17.3, 17.9), p = 0.35;
  aR.set(V(RX + 0.2, rocket.position.y + 0.25, 0), V(0, 1, 0), p, ro); aG.set(V(RX + 0.2, rocket.position.y - 0.05, 0), V(0, -1, 0), p, ro);
  lR.show(V(RX + 0.36, rocket.position.y + 0.45, 0), ro); lG.show(V(RX + 0.38, rocket.position.y - 0.32, 0), ro);
  const kc = seg(t, 11.6, 12.6), lx = lerp(-0.45, RX, kc);
  orbit(camera, t, { ang: 0.0, swing: 0.1, rad: lerp(2.1, 2.4, kc), y: lerp(0.9, 0.8 + y * 0.6, kc), look: [lx, lerp(0.12, 0.45 + y * 0.8, kc), 0], cx: lx });
  return st.render();
};
ready();
</script>
</body></html>

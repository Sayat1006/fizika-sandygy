<style>
/* Басты бет: бір ой, бір әрекет, бір көрнекі элемент. Артық ештеңе жоқ. */
.nav { position: static; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 0; }
.nav .wrap { height: 56px; }
.navlink { font-size: 13px; color: var(--fg-2); white-space: nowrap; }
.navlink:hover { color: var(--fg); text-decoration: none; }
.lang { border: 0; background: none; padding: 6px 2px; color: var(--fg-2); font: 400 13px var(--text); cursor: pointer; }
.lang:hover { color: var(--fg); }
@media (max-width: 380px) { .nav .wrap { gap: 10px; } .nav .right { gap: 12px; } }

.hero { text-align: center; display: grid; justify-items: center; padding-top: clamp(40px, 9vh, 96px); }
.eyebrow { color: var(--fg-2); font-size: clamp(15px, 1.5vw, 19px); font-weight: 500; }
h1 { font-size: clamp(48px, 9vw, 104px); font-weight: 700; line-height: 1.02; letter-spacing: -0.035em; margin-top: 10px; }
.sub { color: var(--fg-2); font-size: clamp(19px, 2.1vw, 26px); line-height: 1.3; letter-spacing: -0.01em; max-width: 30ch; margin-top: 18px; text-wrap: balance; }
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 28px; margin-top: 28px; }
.pill.lg { font-size: 17px; padding: 12px 24px; min-height: 48px; }
.more { font-size: 17px; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.more::after { content: "›"; font-size: 1.2em; line-height: 1; transition: transform .2s var(--ease); }
.more:hover { text-decoration: none; } .more:hover::after { transform: translateX(3px); }

.stage { position: relative; width: min(100%, 600px); aspect-ratio: 5 / 4; margin-top: clamp(8px, 3vh, 32px); }
#atom { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.atom-fallback { position: absolute; inset: 0; display: grid; place-items: center; }
.atom-fallback svg { width: 56%; height: auto; color: var(--fg-3); }

.lab { margin-block: clamp(24px, 6vh, 72px) clamp(40px, 8vh, 96px); padding: clamp(44px, 8vw, 88px) 24px; border-radius: 28px; background: var(--bg-2); text-align: center; display: grid; justify-items: center; gap: 10px; color: var(--fg); }
.lab:hover { text-decoration: none; }
.lab h2 { font-size: clamp(30px, 5vw, 56px); font-weight: 700; line-height: 1.06; letter-spacing: -0.03em; }
.lab p { color: var(--fg-2); font-size: clamp(17px, 1.8vw, 21px); max-width: 30ch; }
.lab .more { margin-top: 6px; color: var(--accent); }
.lab:hover .more::after { transform: translateX(3px); }

footer { background: none; }
footer .wrap { border-top: 1px solid var(--line); }
footer .wrap a { color: var(--fg-2); }
footer .wrap > span:last-child { display: flex; flex-wrap: wrap; gap: 4px; }

.rise { animation: rise .9s var(--out) both; }
.rise.d1 { animation-delay: .08s; } .rise.d2 { animation-delay: .16s; } .rise.d3 { animation-delay: .24s; } .rise.d4 { animation-delay: .4s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="118 117.5 390 390" aria-hidden="true"><path d="M495 244 L313 155 L131 244 L131 277 L313 370 L313 345 L153 262 L313 183 L495 272 Z M131 381 L313 470 L495 381 L495 348 L313 255 L313 280 L473 363 L313 442 L131 353 Z" style="fill:var(--fg)"/></svg>
      Сабақтас
    </a>
    <div class="right">
      <a class="navlink" href="/lab" data-i="lab"></a>
      <button class="lang" id="lang" type="button"></button>
      <a class="pill sm" href="/app" data-i="login"></a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow rise" data-i="eyebrow"></p>
    <h1 class="rise d1" data-i="h1"></h1>
    <p class="sub rise d2" data-i="sub"></p>
    <div class="cta rise d3">
      <a class="pill lg" href="/app?signup" data-i="signup"></a>
      <a class="more" href="/samples" data-i="cta"></a>
    </div>
    <div class="stage rise d4" aria-hidden="true">
      <canvas id="atom"></canvas>
      <div class="atom-fallback" id="atom-fallback" hidden>
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.2"><ellipse cx="100" cy="100" rx="88" ry="32"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(60 100 100)"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(120 100 100)"/><circle cx="100" cy="100" r="13" fill="var(--accent)" stroke="none"/></svg>
      </div>
    </div>
  </section>

  <a class="lab" href="/lab" data-reveal>
    <h2 data-i="labT"></h2>
    <p data-i="labP"></p>
    <span class="more" data-i="labGo"></span>
  </a>
</main>

<footer><div class="wrap"><span>© 2026 Сабақтас</span><span><a id="wa-link" target="_blank" rel="noopener">WhatsApp</a> · <a id="tg-link" target="_blank" rel="noopener">Telegram</a> · <a href="/oferta">Оферта</a> · <a href="/privacy" data-i="priv"></a></span></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="/assets/morph.js" defer></script>
<script src="/assets/config.js"></script>
<script>
const C = window.FS_CONFIG;
const T = {
  kk: {
    login: 'Кіру', lab: '3D зертхана', other: 'Рус', eyebrow: 'Физика · 7–11-сынып',
    h1: 'ҚМЖ — тегін.', sub: 'Кез келген тақырыпқа. Презентация мен жұмыс парағы жазылыммен.',
    signup: 'Тегін ҚМЖ алу', cta: 'Үлгіні көру',
    labT: '3D зертхана.', labP: 'Оқушы тәжірибе жасайды, өлшейді, есеп алады.', labGo: 'Зертхананы ашу', priv: 'Құпиялылық'
  },
  ru: {
    login: 'Войти', lab: '3D лаборатория', other: 'Қаз', eyebrow: 'Физика · 7–11 классы',
    h1: 'ҚМЖ — бесплатно.', sub: 'По любой теме. Презентации и рабочие листы по подписке.',
    signup: 'Получить ҚМЖ', cta: 'Посмотреть образец',
    labT: '3D лаборатория.', labP: 'Ученик ставит опыт, измеряет и получает отчёт.', labGo: 'Открыть лабораторию', priv: 'Конфиденциальность'
  }
};
const $ = id => document.getElementById(id);
let lang = 'kk';
try { if (localStorage.getItem('fs-lang') === 'ru') lang = 'ru'; } catch (_) {}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t[el.dataset.i]; });
  $('lang').textContent = t.other;
  $('lang').setAttribute('aria-label', lang === 'kk' ? 'Русский язык' : 'Қазақ тілі');
  $('wa-link').href = 'https://wa.me/' + C.whatsapp; $('tg-link').href = 'https://t.me/' + C.telegram;
}
$('lang').addEventListener('click', () => { lang = lang === 'kk' ? 'ru' : 'kk'; try { localStorage.setItem('fs-lang', lang); } catch (_) {} render(); });
render();

window.addEventListener('load', function () {
  const canvas = $('atom');
  const morph = window.FSMorph && FSMorph.mount(canvas, { hold: 4.2, morph: 2.2, size: 3.4 });
  if (!morph) { canvas.hidden = true; $('atom-fallback').hidden = false; }
});
</script>

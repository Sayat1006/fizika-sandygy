<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;src:url(../../../public/assets/fonts/inter-cyrillic-wght-normal.woff2) format('woff2-variations');font-weight:100 900;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:I;src:url(../../../public/assets/fonts/inter-cyrillic-ext-wght-normal.woff2) format('woff2-variations');font-weight:100 900;unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F}
@font-face{font-family:I;src:url(../../../public/assets/fonts/inter-latin-wght-normal.woff2) format('woff2-variations');font-weight:100 900;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
html,body{margin:0;background:transparent;font-family:I,sans-serif}
#c{position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 35%,#ffffff 0%,#eef2f7 60%,#e3e9f1 100%)}
.mon{position:absolute;border-radius:28px;background:#16181d;box-shadow:0 40px 80px -30px rgba(20,30,50,.45),0 0 0 2px #2a2d34 inset}
.hole{position:absolute;background:#000;border-radius:6px}
.neck{position:absolute;background:linear-gradient(#c9ced6,#aeb4bd);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.base{position:absolute;border-radius:10px;background:linear-gradient(#d4d8de,#b5bbc4);box-shadow:0 14px 26px -12px rgba(20,30,50,.5)}
.sub{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#14181f;letter-spacing:-.01em}
.sub span{background:#fff;padding:12px 30px;border-radius:999px;box-shadow:0 10px 30px -14px rgba(20,30,50,.35)}
.ph{position:absolute;border-radius:58px;background:#111;box-shadow:0 30px 60px -20px rgba(0,0,0,.5),0 0 0 3px #333 inset}
.phh{position:absolute;border-radius:40px;background:#000}
</style></head><body><div id="c"></div><script>
const q=new URLSearchParams(location.search),k=q.get('k'),W=+q.get('w'),H=+q.get('h');const c=document.getElementById('c');c.style.width=W+'px';c.style.height=H+'px';
const G=JSON.parse(q.get('g')||'{}');
const el=(cls,st,html='')=>{const d=document.createElement('div');d.className=cls;Object.assign(d.style,st);d.innerHTML=html;c.appendChild(d);return d};
if(k==='frame'){ // монитор: экран — мөлдір тесік
  const s=G.s,b=22;
  el('bg',{});
  el('mon',{left:(s.x-b)+'px',top:(s.y-b)+'px',width:(s.w+2*b)+'px',height:(s.h+2*b)+'px'});
  const nk=G.neck; el('neck',{left:nk.x+'px',top:nk.y+'px',width:nk.w+'px',height:nk.h+'px'});
  const bs=G.base; el('base',{left:bs.x+'px',top:bs.y+'px',width:bs.w+'px',height:bs.h+'px'});
  if(G.logo) el('sub',{top:'360px',fontSize:'64px'},'<b style="font-size:76px;letter-spacing:-.03em">Сабақтас</b><div style="font-size:40px;font-weight:600;color:#4a525e;margin-top:18px">Физика · 7–11-сынып</div>');
}
if(k==='phone'){ const s=G.s,b=16; el('ph',{left:(s.x-b)+'px',top:(s.y-b)+'px',width:(s.w+2*b)+'px',height:(s.h+2*b)+'px'}); }
if(k==='sub'){ el('sub',{top:G.y+'px',fontSize:G.fs+'px'},'<span>'+q.get('t')+'</span>'); }
window.ready=1;
</script></body></html>

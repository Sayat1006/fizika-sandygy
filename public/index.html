<style>
/* Layout: one calm screen — text left, atom right; a single three-step line beneath. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.nav { position: static; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 0; }
.nav .wrap { height: 64px; }
.navlink { font-size: 14px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.navlink:hover { color: var(--fg); text-decoration: none; }
.navlab { display: none; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 999px; background: var(--bg-2); color: var(--accent); font: 700 12px var(--text); }
.navlab:hover { text-decoration: none; }
.navlab svg { width: 16px; height: 16px; }
@media (max-width: 560px) { .navlink { display: none; } .navlab { display: inline-flex; } .nav .right { gap: 8px; } }
@media (max-width: 380px) { .navlab span { display: none; } .navlab { padding: 0 9px; } .nav .wrap { gap: 8px; } .nav .right { gap: 6px; } .seg button { padding: 5px 7px; } .brand { font-size: 15px; gap: 6px; } .nav .pill.sm { padding: 6px 11px; } }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--fg-2); font: 600 12px var(--text); padding: 5px 10px; border-radius: 999px; cursor: pointer; min-height: 28px; transition: background .2s var(--ease), color .2s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

.hero { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: clamp(16px, 4vw, 56px); padding-block: clamp(24px, 5vh, 64px); }
.hero .txt { display: grid; gap: 18px; justify-items: start; min-width: 0; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: clamp(15px, 1.3vw, 17px); }
h1 { font-size: clamp(42px, 6.6vw, 84px); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; }
.sub { color: var(--fg-2); font-size: clamp(18px, 1.7vw, 22px); line-height: 1.4; max-width: 30ch; }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; margin-top: 10px; }
.pill.lg { font-size: 17px; padding: 13px 26px; min-height: 50px; }
.more { font-size: 17px; display: inline-flex; align-items: center; gap: 4px; min-height: 48px; }
.more::after { content: "›"; font-size: 1.2em; line-height: 1; transition: transform .2s var(--ease); }
.more:hover { text-decoration: none; }
.more:hover::after { transform: translateX(3px); }
.free { font-size: 14px; color: var(--fg-3); }
.labcard { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 420px; padding: 12px 16px; border-radius: 16px; background: var(--bg-2); color: var(--fg); text-align: left; transition: background .2s var(--ease); }
.labcard:hover { text-decoration: none; background: color-mix(in srgb, var(--accent) 10%, var(--bg-2)); }
.labcard .ic, .labcard .go { transition: transform .5s var(--out); }
.labcard:hover .ic { transform: rotate(-10deg) scale(1.06); }
.labcard:hover .go { transform: translateX(4px); }
.labcard .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.labcard .ic svg { width: 22px; height: 22px; }
.labcard .tx { display: grid; min-width: 0; }
.labcard .tx b { font: 700 16px var(--display); }
.labcard .tx span { font-size: 13.5px; color: var(--fg-2); }
.labcard .go { margin-left: auto; font-size: 22px; color: var(--fg-3); }

.stage { position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 520px; justify-self: center; }
#atom { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.shape { position: absolute; left: 0; right: 0; bottom: -4px; text-align: center; font: 600 13px var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); pointer-events: none; }
.dots { position: absolute; left: 0; right: 0; bottom: -20px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots i { width: 5px; height: 5px; border-radius: 99px; background: var(--line); transition: width .5s var(--out), background .5s var(--out); }
.dots i.on { width: 18px; background: var(--accent); }
.atom-fallback { position: absolute; inset: 0; display: grid; place-items: center; }
.atom-fallback svg { width: 70%; height: auto; color: var(--fg-3); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; border-top: 1px solid var(--line); padding-block: 28px 8px; margin-bottom: clamp(24px, 4vh, 48px); }
.step { display: grid; gap: 4px; align-content: start; }
.step .n { font: 700 13px var(--display); color: var(--accent); }
.step b { font: 700 18px var(--display); letter-spacing: -0.01em; }
.step span { color: var(--fg-2); font-size: 15px; }

footer .wrap a { color: var(--fg-2); }
footer .wrap > span:last-child { display: flex; flex-wrap: wrap; gap: 4px; }

.rise { animation: rise .6s var(--ease) both; }
.rise.d1 { animation-delay: .06s; } .rise.d2 { animation-delay: .12s; } .rise.d3 { animation-delay: .18s; }
@keyframes rise { from { opacity: .35; transform: translateY(12px); } to { opacity: 1; transform: none; } }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; text-align: center; padding-top: 8px; }
  .hero .txt { justify-items: center; order: 2; }
  .sub { margin-inline: auto; }
  .cta { justify-content: center; }
  .stage { order: 1; max-width: 260px; }
  .steps { grid-template-columns: 1fr; gap: 18px; text-align: left; }
}
</style>

<body>

  <div class="wrap">

      Сабақтас

        <button id="lang-kk" type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
        <button id="lang-ru" type="button" data-lang="ru" aria-pressed="false">РУС</button>

<main class="wrap">
  <section class="hero">

      <p class="eyebrow rise" data-i="eyebrow"></p>
      <h1 class="rise d1" data-i="h1"></h1>
      <p class="sub rise d2" data-i="sub"></p>
      <div class="cta rise d3">
        <a class="pill lg" href="/app?signup" data-i="signup"></a>
        <a class="more" href="/samples" data-i="cta"></a>
      </div>
      <a class="labcard rise d3" href="/lab">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></span>
        <span class="tx"><b data-i="labT"></b><span data-i="labP"></span></span>

      </a>

      <div class="atom-fallback" id="atom-fallback" aria-hidden="true" hidden>
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="100" cy="100" rx="88" ry="32"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(60 100 100)"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(120 100 100)"/><circle cx="100" cy="100" r="14" fill="var(--accent)" stroke="none"/></svg>
      </div>
    </div>
  </section>

  <section class="steps" aria-label="Қалай жұмыс істейді">
    <div class="step" data-reveal="0"><span class="n">1</span><b data-i="s1"></b><span data-i="s1p"></span></div>
    <div class="step" data-reveal="1"><span class="n">2</span><b data-i="s2"></b><span id="s2p"></span></div>
    <div class="step" data-reveal="2"><span class="n">3</span><b data-i="s3"></b><span id="s3p"></span></div>
  </section>
</main>

<footer><div class="wrap"><span>© 2026 Сабақтас</span><span><span data-i="ask"></span> <a id="wa-link" target="_blank" rel="noopener">WhatsApp</a> · <a id="tg-link" target="_blank" rel="noopener">Telegram</a> · <a href="/lab" data-i="lab"></a> · <a href="/oferta">Оферта</a> · <a href="/privacy">Құпиялылық</a></span></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="/assets/morph.js" defer></script>
<script src="/assets/config.js"></script>
<script>
const C = window.FS_CONFIG;
const T = {
  kk: {
    login: 'Кіру', lab: '3D зертхана', labT: '3D виртуалды зертхана', labP: 'Оқушыларға: тәжірибе жасап, өлшеп, есеп алу', eyebrow: 'Физика · 7–11-сынып',
    h1: 'ҚМЖ — тегін.',
    sub: 'Кез келген тақырыптың ҚМЖ-сын тегін жүктеңіз. Презентация мен жұмыс парағы жазылыммен.',
    cta: 'Алдымен үлгіні көру', signup: 'Тегін ҚМЖ алу', free: 'Тіркелу 1 минут. Карта керек емес.',
    s1: 'Үлгіні көріңіз', s1p: 'Әр сыныптың бір сабағы тегін.',
    s2: 'ҚМЖ-ны тегін алыңыз', s2p: () => 'Тіркеліп, керек тақырыпты таңдаңыз.',
    s3: 'Слайд пен парақ', s3p: (m, y) => `Жазылым: айына ${m} немесе жылына ${y}.`,
    ask: 'Сұрақ болса:',
    shapes: { atom: 'Атом', wave: 'Толқын', spring: 'Серіппе', field: 'Магнит өрісі', planet: 'Ғаламшар' }
  },
  ru: {
    login: 'Войти', lab: '3D лаборатория', labT: '3D виртуальная лаборатория', labP: 'Ученикам: опыты, измерения и отчёт', eyebrow: 'Физика · 7–11 классы',
    h1: 'ҚМЖ — бесплатно.',
    sub: 'ҚМЖ по любой теме скачивайте бесплатно. Презентации и рабочие листы — по подписке.',
    cta: 'Сначала посмотреть образец', signup: 'Получить ҚМЖ бесплатно', free: 'Регистрация за 1 минуту. Карта не нужна.',
    s1: 'Посмотрите образец', s1p: 'Один урок каждого класса бесплатно.',
    s2: 'Берите ҚМЖ бесплатно', s2p: () => 'Зарегистрируйтесь и выберите тему.',
    s3: 'Презентации и листы', s3p: (m, y) => `Подписка: ${m} в месяц или ${y} в год.`,
    ask: 'Вопросы:',
    shapes: { atom: 'Атом', wave: 'Волна', spring: 'Пружина', field: 'Магнитное поле', planet: 'Планета' }
  }
};
let lang = 'kk', shapeName = '';
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU').replace(/ /g, ' ') + ' ₸';
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { const v = t[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  $('s2p').textContent = t.s2p(fmt(C.prices.month), fmt(C.prices.year));
  $('s3p').textContent = t.s3p(fmt(C.prices.month), fmt(C.prices.year));
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  if (shapeName) $('shape').textContent = t.shapes[shapeName];
  $('wa-link').href = 'https://wa.me/' + C.whatsapp; $('tg-link').href = 'https://t.me/' + C.telegram;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (b) { lang = b.dataset.lang; try { localStorage.setItem('fs-lang', lang); } catch (_) {} render(); }
});
try { const l = localStorage.getItem('fs-lang'); if (l === 'ru' || l === 'kk') lang = l; } catch (_) {}
render();

window.addEventListener('load', function () {
  const canvas = $('atom'), fb = $('atom-fallback'), dots = $('dots').children;
  const morph = window.FSMorph && FSMorph.mount(canvas, {
    onShape(name, i) {
      shapeName = name;
      FSMotion.swap($('shape'), T[lang].shapes[name]);
      for (let k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === i);
    }
  });
  if (!morph) { canvas.hidden = true; fb.hidden = false; $('dots').hidden = true; }
});
</script>
</body>

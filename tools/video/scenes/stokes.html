<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Тұтқыр сұйықтың қозғалысы. Стокс формуласы» (10-сынып): глицеринге екі болат шарик тасталады (r және 2r).
// Шарикке ауырлық күші, Архимед күші және Стокс кедергі күші F = 6πηrυ әсер етеді; жылдамдық тез тұрақталады
// (белгілер арасы тең уақытта бірдей). Шекті жылдамдық υ ∝ r² — үлкен шарик 4 есе жылдам түседі. υ(t) графигі.
// Сандық есеп: m dυ/dt = (ρ − ρ_с)Vg − 6πηrυ; уақыт масштабы көрнекілік үшін таңдалған.
import { THREE, V, stage, orbit, arrow, label, hudPlot, simulate, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [3.4, 2.2] }), { scene, camera, hud } = st;
const H = 1.6, R = 0.13, XS = [-0.45, 0.25];
for (const x of XS) { const g = mesh(new THREE.CylinderGeometry(R, R, H, 40, 1, true), mat.glass(), { parent: scene, pos: [x, H / 2 + 0.02, 0], shadow: false }); g.renderOrder = 5;
  const liq = mesh(new THREE.CylinderGeometry(R - 0.006, R - 0.006, H - 0.12, 40), new THREE.MeshPhysicalMaterial({ color: '#f3d36b', transparent: true, opacity: 0.38, depthWrite: false }), { parent: scene, pos: [x, (H - 0.12) / 2 + 0.03, 0], shadow: false }); liq.renderOrder = 2;
  mesh(new THREE.CylinderGeometry(R + 0.04, R + 0.05, 0.03, 40), mat.dark, { parent: scene, pos: [x, 0.015, 0] });
  for (let k = 1; k <= 6; k++) mesh(new THREE.TorusGeometry(R + 0.002, 0.003, 6, 40), new THREE.MeshBasicMaterial({ color: '#1b2230' }), { parent: scene, pos: [x, 0.03 + k * 0.2, 0], rot: [Math.PI / 2, 0, 0], shadow: false }); }
const rs = [0.022, 0.044], balls = rs.map((r, i) => mesh(new THREE.SphereGeometry(r, 24, 16), new THREE.MeshStandardMaterial({ color: '#9aa4b2', metalness: 0.85, roughness: 0.25 }), { parent: scene }));
const TOP = H - 0.12, VT = [0.07, 0.28], TAU = [0.15, 0.6]; // шекті жылдамдық (υ ∝ r²), релаксация уақыты (∝ r²)
const sims = VT.map((vt, i) => simulate({ y: TOP + 0.08, v: 0 }, (s, t, dt) => { const t0 = 1.0 + i * 0.0; if (t < t0) return; const inLiq = s.y < TOP; const a = inLiq ? (vt - s.v) / TAU[i] : 3; s.v += a * dt; s.y -= s.v * dt; if (s.y < 0.04 + rs[i]) { s.y = 0.04 + rs[i]; s.v = 0; } }));
const plot = hudPlot(hud, { x: 930, y: 380, w: 320, h: 270, ax: ['t', ''], ay: ['υ', ''] });
const aG = arrow(scene, '#e5483a', { r: 0.01 }), aF = arrow(scene, '#1f6fd0', { r: 0.01 }), lG = label(scene, 'mg', '', '#e5483a', { size: 0.22 }), lF = label(scene, 'F + F', 'A', '#1f6fd0', { size: 0.22 });
const marks = [[], []];
for (let i = 0; i < 2; i++) for (let k = 0; k < 12; k++) { const m = mesh(new THREE.BoxGeometry(0.06, 0.004, 0.004), new THREE.MeshBasicMaterial({ color: '#e5483a' }), { parent: scene, shadow: false }); m.visible = false; marks[i].push(m); }

window.renderFrame = (t) => {
  sims.forEach((S, i) => { const s = S(t); balls[i].position.set(XS[i], s.y, 0.0);
    marks[i].forEach((m, k) => { const tk = 1.0 + (k + 1) * 0.7; m.visible = t > tk && S(tk).y > 0.06 + rs[i]; m.position.set(XS[i] + R + 0.05, S(tk).y, 0); }); });
  const s1 = sims[1](t), o = win(t, 3.0, 3.4, 5.5, 6.0) * (s1.y > 0.2 ? 1 : 0);
  aG.set(V(XS[1] - 0.06, s1.y, 0.12), V(0, -1, 0), 0.22, o); aF.set(V(XS[1] - 0.06, s1.y, 0.12), V(0, 1, 0), 0.22, o);
  lG.show(V(XS[1] - 0.2, s1.y - 0.18, 0.12), o); lF.show(V(XS[1] - 0.24, s1.y + 0.2, 0.12), o);
  const series = sims.map((S, i) => { const pts = []; for (let k = 0; k <= 80; k++) { const tt = 1.0 + k * 0.2; if (tt > t) break; const q = S(tt); pts.push([k / 80 * 0.95, Math.min(0.95, q.v / 0.3 * 0.85)]); } return { pts, color: i ? '#e5683a' : '#1f6fd0', label: '' }; });
  plot.draw(series, seg(t, 0.5, 1.0));
  orbit(camera, t, { ang: 0.0, swing: 0.12, rad: 3.0, y: 1.1, look: [0.1, 0.8, 0], cx: 0.1 });
  return st.render();
};
ready();
</script>
</body></html>

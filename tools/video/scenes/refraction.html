<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Жарықтың сынуы. Толық ішкі шағылу» (8-сынып): оптикалық шайбадағы жартылай цилиндр шыны (n = 1,5).
// 1) ауадан шыныға: sinα / sinγ = n — сыну бұрышы түсу бұрышынан кіші; 2) шыныдан ауаға: сыну бұрышы үлкен,
// түсу бұрышы шекті бұрыштан (arcsin(1/1,5) ≈ 42°) асқанда сынған сәуле жоғалады — толық ішкі шағылу.
import { THREE, V, stage, orbit, readout, beam, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [3.6, 2.4] }), { scene, camera } = st;
const Y = 0.05, DR = 0.6, N = 1.5, D2R = Math.PI / 180;
const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
g.fillStyle = '#ffffff'; g.beginPath(); g.arc(512, 512, 506, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#1b2230'; g.lineWidth = 4; g.stroke();
g.fillStyle = '#1b2230'; g.font = 'bold 34px Arial'; g.textAlign = 'center';
for (let d = 0; d < 360; d += 5) { const a = d * Math.PI / 180, big = d % 10 === 0, r0 = big ? 450 : 475; g.lineWidth = big ? 4 : 2; g.beginPath(); g.moveTo(512 + Math.sin(a) * r0, 512 - Math.cos(a) * r0); g.lineTo(512 + Math.sin(a) * 504, 512 - Math.cos(a) * 504); g.stroke();
  const n = d <= 90 ? d : d <= 180 ? 180 - d : d <= 270 ? d - 180 : 360 - d; if (big && d % 30 === 0) g.fillText(String(n), 512 + Math.sin(a) * 410, 512 - Math.cos(a) * 410 + 12); }
g.setLineDash([16, 12]); g.lineWidth = 3; g.beginPath(); g.moveTo(512, 40); g.lineTo(512, 984); g.stroke();
const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
mesh(new THREE.CylinderGeometry(DR, DR, 0.02, 64), new THREE.MeshStandardMaterial({ color: '#e9edf2' }), { parent: scene, pos: [0, 0.01, 0] });
mesh(new THREE.CircleGeometry(DR - 0.005, 64), new THREE.MeshBasicMaterial({ map: tx }), { parent: scene, pos: [0, 0.021, 0], rot: [-Math.PI / 2, 0, 0], shadow: false });
// жартылай цилиндр: жазық беті x осінде (z = 0), дөңес жағы −z жақта
const GR = 0.4, sh = new THREE.Shape(); sh.moveTo(-GR, 0); sh.absarc(0, 0, GR, Math.PI, 2 * Math.PI, false); sh.lineTo(-GR, 0);
const gl = mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: false, curveSegments: 48 }), new THREE.MeshPhysicalMaterial({ color: '#d6f0ff', transparent: true, opacity: 0.35, roughness: 0.05, depthWrite: false, side: THREE.DoubleSide }), { parent: scene, pos: [0, 0.021, 0], rot: [Math.PI / 2, 0, 0], shadow: false });
gl.rotation.set(-Math.PI / 2, 0, 0); gl.scale.set(1, -1, 1); gl.renderOrder = 4; // дөңес жағы −z
const laser = new THREE.Group(); scene.add(laser); mesh(new THREE.BoxGeometry(0.06, 0.05, 0.2), mat.dark, { parent: laser });
const inc = beam(scene, '#ff2a2a'), refr = beam(scene, '#ff2a2a'), refl = beam(scene, '#ff2a2a', { r: 0.004 });
const rA = readout(scene, { color: '#e5483a', w: 0.48 }), rG = readout(scene, { color: '#1f6fd0', w: 0.48 });
const dirAt = (ang, side) => V(Math.sin(ang), 0, side * Math.cos(ang)); // side +1: +z жаққа

window.renderFrame = (t) => {
  const O = V(0, Y, 0);
  let src, a, outA, refrOp = 1, reflOp = 0.25, side;
  if (t < 8.6) { // 1) ауа → шыны
    a = (t < 3.4 ? 20 : t < 5.6 ? lerp(20, 45, seg(t, 3.4, 4.4)) : lerp(45, 65, seg(t, 5.6, 6.6))) * D2R; side = 1;
    src = O.clone().addScaledVector(dirAt(a, 1).multiplyScalar(-1).multiply(V(1, 0, -1)), 0); src = V(-Math.sin(a) * 0.55, Y, Math.cos(a) * 0.55);
    const b = Math.asin(Math.sin(a) / N); outA = b;
    inc.set([src, O], win(t, 0.6, 1.0, 8.2, 8.6), seg(t, 0.9, 1.4));
    refr.set([O, V(Math.sin(b) * 0.55, Y, -Math.cos(b) * 0.55)], win(t, 0.6, 1.0, 8.2, 8.6), seg(t, 1.4, 1.9));
    refl.set([O, V(Math.sin(a) * 0.5, Y, Math.cos(a) * 0.5)], 0.3 * win(t, 0.6, 1.0, 8.2, 8.6), seg(t, 1.4, 1.9));
    rA.set('α = ' + Math.round(a / D2R) + '°', win(t, 1.6, 2.0, 8.2, 8.6)); rG.set('γ = ' + Math.round(b / D2R) + '°', win(t, 1.9, 2.3, 8.2, 8.6));
  } else { // 2) шыны → ауа: лазер дөңес жақтан центрге
    a = (t < 11 ? 25 : t < 13.4 ? lerp(25, 40, seg(t, 11, 12)) : lerp(40, 55, seg(t, 13.4, 14.6))) * D2R;
    src = V(-Math.sin(a) * 0.58, Y, -Math.cos(a) * 0.58);
    const s = N * Math.sin(a), tir = s >= 1; const b = tir ? 0 : Math.asin(s);
    const o = win(t, 8.8, 9.2, 17.3, 17.9);
    inc.set([src, O], o, seg(t, 9.1, 9.6));
    refr.set([O, V(Math.sin(b) * 0.55, Y, Math.cos(b) * 0.55)], tir ? 0 : o, seg(t, 9.6, 10.1));
    refl.set([O, V(Math.sin(a) * 0.55, Y, -Math.cos(a) * 0.55)], o * (tir ? 1 : 0.18 + 0.5 * Math.max(0, (s - 0.8) / 0.2)), seg(t, 9.6, 10.1));
    rA.set('α = ' + Math.round(a / D2R) + '°', win(t, 9.8, 10.2, 17.3, 17.9)); rG.set(tir ? 'γ —' : 'γ = ' + Math.round(b / D2R) + '°', win(t, 10.1, 10.5, 17.3, 17.9));
  }
  const dl = src.clone().sub(O).normalize(); laser.position.copy(src).addScaledVector(dl, 0.1); laser.rotation.y = Math.atan2(dl.x, dl.z);
  rA.position.set(-0.5, 0.3, 0.62); rG.position.set(0.5, 0.3, 0.62);
  orbit(camera, t, { ang: 0.0, swing: 0.06, rad: 1.15, y: 1.75, look: [0, 0, 0.1] });
  return st.render();
};
ready();
</script>
</body></html>

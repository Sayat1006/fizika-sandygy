<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Көлбеу жазықтық және ПӘК» (7-сынып, №10 зертханалық): брусокты h = 20 см биіктікке тікелей көтеру — F = mg = 5 Н, A = 1 Дж;
// l = 80 см көлбеу жазықтықпен — F = 2 Н (үйкеліспен), A = 1,6 Дж; η = 1/1,6 = 62,5%. Сахна масштабы: 1 бірлік = 0,5 м.
import { THREE, V, stage, orbit, dynamometer, arrow, label, readout, seg, win, lerp, mat, mesh, num, ready } from './kit.js';
const st = stage({ table: [4.6, 2.2] }), { scene, camera } = st;

const S = 0.5, h = 0.2 / S, l = 0.8 / S, a = Math.asin(h / l), X0 = -0.3; // h = 0,4; l = 1,6 бірлік
const base = l * Math.cos(a);
const tri = new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(base, 0), new THREE.Vector2(base, h)]);
mesh(new THREE.ExtrudeGeometry(tri, { depth: 0.5, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: '#e6d3b0', roughness: 0.8 }), { parent: scene, pos: [X0, 0, -0.25] });
mesh(new THREE.BoxGeometry(0.5, h, 0.5), new THREE.MeshStandardMaterial({ color: '#d9c39c', roughness: 0.8 }), { parent: scene, pos: [X0 + base + 0.25, h / 2, 0] });
const blk = (col) => { const g = new THREE.Group(); mesh(new THREE.BoxGeometry(0.24, 0.12, 0.18), new THREE.MeshStandardMaterial({ color: col, roughness: 0.6 }), { parent: g, pos: [0, 0.06, 0] }); scene.add(g); return g; };
const b1 = blk('#5b8def'), b2 = blk('#5b8def');
const d1 = dynamometer(scene, { max: 6, K: 0.05 }), d2 = dynamometer(scene, { max: 6, K: 0.05 }); d1.scale.setScalar(0.55); d2.scale.setScalar(0.55);
const th1 = mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 6), mat.dark, { parent: scene, shadow: false }), th2 = mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 6), mat.dark, { parent: scene, shadow: false });
const r1 = readout(scene, { color: '#1b2230', w: 0.46 }), r2 = readout(scene, { color: '#1b2230', w: 0.46 }), rA1 = readout(scene, { color: '#1f6fd0', w: 0.62 }), rA2 = readout(scene, { color: '#e5483a', w: 0.62 }), rE = readout(scene, { color: '#17a05d', w: 0.7 });
const XL = -1.5; // тік көтеру орны
const brM = new THREE.MeshBasicMaterial({ color: '#1f6fd0', transparent: true, depthTest: false });
const brH = mesh(new THREE.BoxGeometry(0.01, h, 0.01), brM, { parent: scene, pos: [XL - 0.3, h / 2, 0.15], shadow: false }); brH.renderOrder = 9;
const lh = label(scene, 'h', '', '#1f6fd0', { size: 0.28 }), ll = label(scene, 'l', '', '#e5683a', { size: 0.28 });
const aG = arrow(scene, '#e5483a', { r: 0.014 }), lG = label(scene, 'mg', '', '#e5483a', { size: 0.24 }), aF = arrow(scene, '#1f6fd0', { r: 0.014 }), lF = label(scene, 'F', '', '#1f6fd0', { size: 0.24 });
const dir = V(Math.cos(a), Math.sin(a), 0), nrm = V(-Math.sin(a), Math.cos(a), 0);

function hang(d, F, hook, rotZ) { d.rotation.z = rotZ; const hy = d.set(F) * 0.55; const off = V(0, hy, 0).applyAxisAngle(V(0, 0, 1), rotZ); d.position.copy(hook).sub(off); }

window.renderFrame = (t) => {
  // 1) тік көтеру: 1,0–5,5 с
  const k1 = seg(t, 1.2, 5.2), y1 = h * k1, F1 = t < 1.0 ? 0 : 5 * seg(t, 0.4, 1.1);
  b1.position.set(XL, y1, 0);
  const hook1 = V(XL, y1 + 0.12 + 0.1, 0); hang(d1, F1, hook1, 0);
  th1.scale.y = 0.1; th1.position.set(XL, y1 + 0.17, 0);
  r1.set(num(F1) + ' Н', win(t, 0.6, 1.0, 17.2, 17.8)); r1.position.set(XL - 0.42, hook1.y + 0.5, 0.1);
  brM.opacity = seg(t, 5.2, 5.8); lh.show(V(XL - 0.42, h / 2, 0.15), seg(t, 5.2, 5.8));
  // 2) көлбеу жазықтық: 7,0–12,5 с
  const k2 = seg(t, 7.0, 12.5), s = 0.05 + (l - 0.32) * k2, F2 = t < 6.6 ? 0 : 2 * seg(t, 6.4, 6.9) + (t > 6.9 && t < 12.6 ? 0.04 * Math.sin(t * 9) : 0);
  const p2 = V(X0, 0, 0).add(dir.clone().multiplyScalar(s)); b2.position.copy(p2); b2.rotation.z = a;
  const hook2 = p2.clone().add(dir.clone().multiplyScalar(0.22)).add(nrm.clone().multiplyScalar(0.06));
  hang(d2, F2, hook2, a - Math.PI / 2);
  th2.scale.y = 0.1; th2.rotation.z = a - Math.PI / 2; th2.position.copy(p2.clone().add(dir.clone().multiplyScalar(0.17)).add(nrm.clone().multiplyScalar(0.06)));
  r2.set(num(F2) + ' Н', win(t, 6.4, 6.8, 17.2, 17.8)); r2.position.copy(hook2.clone().add(dir.clone().multiplyScalar(0.55)).add(V(0, 0.32, 0.1)));
  ll.show(V(X0 + base / 2 - 0.1, h / 2 + 0.18, 0.3), seg(t, 12.5, 13.0));
  // күштер (тік көтеруде)
  const fo = win(t, 2.0, 2.5, 5.4, 6.0);
  aG.set(V(XL + 0.18, y1 + 0.06, 0.12), V(0, -1, 0), 0.3, fo); lG.show(V(XL + 0.32, y1 - 0.12, 0.12), fo);
  aF.set(V(XL + 0.18, y1 + 0.06, 0.12), V(0, 1, 0), 0.3, fo); lF.show(V(XL + 0.32, y1 + 0.3, 0.12), fo);
  // жұмыстар және ПӘК
  const w1 = win(t, 13.2, 13.7, 17.2, 17.8), w2 = win(t, 14.0, 14.5, 17.2, 17.8), w3 = win(t, 15.0, 15.5, 17.2, 17.8);
  rA1.set('A = 1 Дж', w1); rA1.position.set(XL + 0.05, 1.32, 0.25); rA2.set('A = 1,6 Дж', w2); rA2.position.set(X0 + base * 0.55, 1.0, 0.2); rE.set('η = 62,5 %', w3); rE.position.set(-0.15, 1.55, 0.2);
  const kk = seg(t, 5.8, 7.2), ke = seg(t, 12.6, 13.8);
  const lx = lerp(lerp(XL + 0.25, X0 + base * 0.55, kk), -0.3, ke);
  orbit(camera, t, { ang: -0.05, swing: 0.12, rad: lerp(lerp(3.0, 3.0, kk), 4.3, ke), y: lerp(lerp(1.35, 1.1, kk), 1.5, ke), look: [lx, lerp(lerp(0.62, 0.45, kk), 0.6, ke), 0] });
  return st.render();
};
ready();
</script>
</body></html>

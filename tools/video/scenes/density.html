<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Тығыздық» (7-сынып): 1) көлемі бірдей (27 см³) ағаш, алюминий, болат кубтар таразыда — массасы әртүрлі;
// 2) пішіні дұрыс емес тастың көлемі өлшеуіш цилиндрмен: 50 мл → 70 мл.
import { THREE, V, stage, orbit, label, readout, scaleLCD, cylinder, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [5.6, 2.2] }), { scene, camera } = st;

// ── 1. үш таразы мен үш куб (қыры 3 см) ──
const A = 0.3; // куб қыры (сахна бірлігі)
const cubes = [
  { x: -2.15, color: '#d2a46c', rough: 0.8, metal: 0, m: 19 },   // ағаш (емен, ρ ≈ 0,7 г/см³)
  { x: -1.35, color: '#d5dbe2', rough: 0.35, metal: 0.25, m: 73 },  // алюминий (2,7 г/см³)
  { x: -0.55, color: '#8b939c', rough: 0.4, metal: 0.3, m: 211 }, // болат (7,8 г/см³)
];
for (const [i, c] of cubes.entries()) {
  c.sc = scaleLCD(scene, { w: 0.62, d: 0.52 }); c.sc.position.set(c.x, 0, 0);
  c.mesh = mesh(new THREE.BoxGeometry(A, A, A), new THREE.MeshStandardMaterial({ color: c.color, roughness: c.rough, metalness: c.metal }), { parent: scene });
  c.t0 = 1.0 + i * 1.3;
  c.lV = label(scene, 'V', '', '#1f6fd0', { size: 0.3 }); c.lm = label(scene, 'm', String(i + 1), '#e5483a', { size: 0.3 });
}
// ағаштың талшықтары (сызықтар)
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const x = cv.getContext('2d'); x.fillStyle = '#d2a46c'; x.fillRect(0, 0, 128, 128);
  x.strokeStyle = '#b88a52'; x.lineWidth = 3; for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(0, 8 + i * 14); x.bezierCurveTo(40, 2 + i * 14, 80, 16 + i * 14, 128, 6 + i * 14); x.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; cubes[0].mesh.material.map = t; cubes[0].mesh.material.color.set('#ffffff');
}

// ── 2. өлшеуіш цилиндр және тас ──
const CX = 1.55, cyl = cylinder(scene, { r: 0.24, h: 1.45, ml: 100, step: 10, x: CX });
const sg = new THREE.IcosahedronGeometry(0.12, 4), p = sg.attributes.position;
for (let i = 0; i < p.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(p, i); v.multiplyScalar(1 + 0.12 * Math.sin(v.x * 40 + v.y * 18) * Math.cos(v.z * 31)); v.y *= 0.8; p.setXYZ(i, v.x, v.y, v.z); }
sg.computeVertexNormals();
const stone = mesh(sg, new THREE.MeshStandardMaterial({ color: '#8d8a84', roughness: 0.9 }), { parent: scene });
const thread = mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 6), mat.dark, { parent: scene, shadow: false });
const roV = readout(scene, { color: '#1f6fd0', w: 0.7 });
const band = new THREE.Mesh(new THREE.CylinderGeometry(0.228, 0.228, 1, 40), new THREE.MeshBasicMaterial({ color: '#17d07a', transparent: true, opacity: 0, depthWrite: false })); band.renderOrder = 4; scene.add(band);
const T_IN = 11.0, T_DOWN = 13.2; // тас суға кіре бастайды → түбіне жетеді

window.renderFrame = (t) => {
  // 1) кубтар жоғарыдан таразыға түседі, дисплей санайды
  cubes.forEach((c, i) => {
    const k = seg(t, c.t0, c.t0 + 0.9);
    c.mesh.position.set(c.x, c.sc.top + A / 2 + 0.9 * (1 - k), -0.03); c.mesh.rotation.y = 0.2;
    const shown = k >= 1 ? Math.round(c.m * seg(t, c.t0 + 0.9, c.t0 + 1.5)) : 0;
    c.sc.set(shown + ' г');
    const on = win(t, 5.4 + i * 0.2, 6.0 + i * 0.2, 9.0, 9.6);
    c.lV.show(V(c.x - 0.25, c.sc.top + A * 0.75, 0.12), on);
    c.lm.show(V(c.x + 0.27, c.sc.top + A * 0.75, 0.12), on);
  });
  // 2) тас жіппен цилиндрге түседі: 50 мл → 70 мл
  const sTop = cyl.yOf(100) + 0.5, sBottom = cyl.yOf(0) + 0.1;
  const k1 = seg(t, 9.6, T_IN), k2 = seg(t, T_IN, T_DOWN);
  const ys = lerp(sTop, cyl.yOf(55), k1) + (cyl.yOf(55) * 0 + (sBottom - cyl.yOf(55)) * k2);
  stone.position.set(CX, ys, 0); stone.rotation.y = 0.5 + t * 0.1;
  thread.scale.y = 3.2 - ys; thread.position.set(CX, ys + 0.09 + (3.2 - ys) / 2, 0);
  const sub = Math.min(1, Math.max(0, (cyl.yOf(50) - (ys - 0.1)) / 0.2)); // тастың батқан бөлігі
  const ml = 50 + 20 * sub;
  cyl.setLevel(ml, t, 0.004 * win(t, T_IN - 0.2, T_IN + 0.3, T_DOWN, T_DOWN + 1.5));
  roV.set(Math.round(ml) + ' мл', seg(t, 9.6, 10.2)); roV.position.set(CX + 0.62, cyl.yOf(ml), 0.1);
  const bOn = win(t, 14.0, 14.6, 17.2, 17.8); band.material.opacity = 0.3 * bOn * (0.75 + 0.25 * Math.sin(t * 5)); band.visible = bOn > 0.01;
  band.scale.y = cyl.yOf(ml) - cyl.yOf(50); band.position.set(CX, (cyl.yOf(ml) + cyl.yOf(50)) / 2, 0);
  // камера: таразылар → цилиндр
  const kk = seg(t, 8.4, 10.2);
  const look = [lerp(-1.35, CX + 0.1, kk), lerp(0.3, 0.75, kk), 0];
  orbit(camera, t, { ang: lerp(-0.2, 0.25, kk), swing: 0.2, rad: lerp(3.4, 3.6, kk), y: lerp(1.35, 1.6, kk), look, cx: look[0] });
  return st.render();
};
ready();
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Дененің массалар центрі» (7-сынып, №8 зертханалық): пішінсіз жазық пластина A тесігінен ілінеді — тынышталады, тіктеуіш бойымен сызық;
// сосын B тесігінен — екінші сызық; қиылысы — массалар центрі C (пішіннен есептеледі). C-дан ілсе — кез келген күйде тұрады.
import { THREE, V, stage, orbit, stand, label, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [4.0, 2.2] }), { scene, camera } = st;

// пластина пішіні (жергілікті координата, м)
const SH = [[-0.45, -0.3], [0.1, -0.42], [0.5, -0.18], [0.42, 0.18], [0.12, 0.42], [-0.22, 0.34], [-0.5, 0.08]];
let A = 0, cx = 0, cy = 0; // ауданы және центроиды
for (let i = 0; i < SH.length; i++) { const [x0, y0] = SH[i], [x1, y1] = SH[(i + 1) % SH.length], c = x0 * y1 - x1 * y0; A += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c; }
A /= 2; cx /= 6 * A; cy /= 6 * A; const C = V(cx, cy, 0);
const HA = V(0.06, 0.34, 0), HB = V(-0.4, -0.18, 0), PIN = V(0.15, 1.75, 0.05);
const shape = new THREE.Shape(SH.map(([x, y]) => new THREE.Vector2(x, y)));
for (const h of [HA, HB]) { const p = new THREE.Path(); p.absarc(h.x, h.y, 0.025, 0, Math.PI * 2, true); shape.holes.push(p); }
const plate = new THREE.Group(); scene.add(plate);
mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.02, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: '#f2d38a', roughness: 0.8 }), { parent: plate, pos: [0, 0, -0.01] });
const sd = stand(scene, { x: -1.0, z: 0.05, h: 2.0, arm: 1.2 }); sd.setArmY(1.82);
mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 10), mat.metal, { parent: scene, pos: [PIN.x, PIN.y, PIN.z], rot: [Math.PI / 2, 0, 0] });
// тіктеуіш (жіп + жүк)
const plumb = new THREE.Group(); scene.add(plumb);
mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.95, 6), mat.dark, { parent: plumb, pos: [0, -0.475, 0.04], shadow: false });
mesh(new THREE.ConeGeometry(0.04, 0.09, 16), mat.brass, { parent: plumb, pos: [0, -0.99, 0.04], rot: [Math.PI, 0, 0] });
// сызылатын сызықтар (пластинаның үстінде)
const lineOn = (from, to, color) => { const m = mesh(new THREE.BoxGeometry(1, 0.012, 0.004), new THREE.MeshBasicMaterial({ color }), { parent: plate, shadow: false }); const d = to.clone().sub(from); m.userData = { from, d }; m.rotation.z = Math.atan2(d.y, d.x); return m; };
const ext = (h) => { const d = C.clone().sub(h).normalize(); return [h.clone(), h.clone().add(d.multiplyScalar(0.62))]; };
const [a0, a1] = ext(HA), [b0, b1] = ext(HB);
const LA = lineOn(a0, a1, '#1f6fd0'), LB = lineOn(b0, b1, '#e5483a');
const dot = mesh(new THREE.CircleGeometry(0.03, 24), new THREE.MeshBasicMaterial({ color: '#17a05d' }), { parent: plate, pos: [C.x, C.y, 0.012], shadow: false });
const ring = mesh(new THREE.RingGeometry(0.045, 0.06, 32), new THREE.MeshBasicMaterial({ color: '#17a05d', transparent: true }), { parent: plate, pos: [C.x, C.y, 0.013], shadow: false });
const lA = label(plate, 'A', '', '#1b2230', { size: 0.3, parent: plate }), lB = label(plate, 'B', '', '#1b2230', { size: 0.3, parent: plate }), lC = label(plate, 'C', '', '#0f8a52', { size: 0.34, parent: plate });
const eq = (h) => -Math.PI / 2 - Math.atan2(C.y - h.y, C.x - h.x); // ілу нүктесі h болғанда тепе-теңдік бұрышы
const pose = (h, phi) => { plate.rotation.z = phi; const off = h.clone().applyAxisAngle(V(0, 0, 1), phi); plate.position.copy(PIN).sub(off); };
const damp = (u, phi0, phiE) => phiE + (phi0 - phiE) * Math.exp(-u / 0.9) * Math.cos(u * 3.2);
const reveal = (m, k) => { const { from, d } = m.userData; const L = d.length() * k; m.scale.x = Math.max(0.001, L); m.position.set(from.x + d.x / d.length() * L / 2, from.y + d.y / d.length() * L / 2, 0.012); m.visible = k > 0.01; };

window.renderFrame = (t) => {
  const eA = eq(HA), eB = eq(HB), eC = 0.3 + 0.25 * Math.sin(t * 0.9);
  if (t < 6.0) pose(HA, damp(Math.max(0, t - 0.4), eA + 0.7, eA));
  else if (t < 7.6) { const k = seg(t, 6.0, 7.6); const h = HA.clone().lerp(HB, k); pose(h, lerp(eA, eB + 0.6, k)); }
  else if (t < 13.0) pose(HB, damp(t - 7.6, eB + 0.6, eB));
  else { const k = seg(t, 13.0, 14.2); const h = HB.clone().lerp(C, k); pose(h, lerp(eB, eC, k)); }
  const pOn = win(t, 2.4, 2.9, 5.6, 6.0) + win(t, 9.8, 10.3, 12.6, 13.0); plumb.position.copy(PIN); plumb.visible = pOn > 0.01; plumb.scale.setScalar(1);
  reveal(LA, seg(t, 3.6, 5.0)); reveal(LB, seg(t, 10.8, 12.2));
  const cOn = seg(t, 12.2, 12.8); dot.visible = ring.visible = cOn > 0.01; ring.material.opacity = cOn * (0.6 + 0.4 * Math.sin(t * 6)); ring.scale.setScalar(1 + 0.15 * Math.sin(t * 6));
  lA.show(V(HA.x + 0.08, HA.y + 0.04, 0.03), 1); lB.show(V(HB.x - 0.08, HB.y + 0.06, 0.03), 1); lC.show(V(C.x + 0.1, C.y + 0.06, 0.03), cOn);
  orbit(camera, t, { ang: -0.1, swing: 0.2, rad: 3.0, y: 1.5, look: [0.05, 1.4, 0] });
  return st.render();
};
ready();
</script>
</body></html>

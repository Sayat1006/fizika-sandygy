<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Архимед күші» — 3D сөзсіз видео (18 с). window.renderFrame(t) — t секундтағы кадр.
import * as THREE from 'three';
const W = 1280, H = 720, DUR = 18;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#eef2f7');
scene.fog = new THREE.Fog('#eef2f7', 12, 22);
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 50);

// ── жарық ──
scene.add(new THREE.HemisphereLight('#ffffff', '#c9d3e0', 1.1));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 15 }); sun.shadow.radius = 4; sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight('#dbe8ff', 0.6); fill.position.set(-4, 3, -2); scene.add(fill);

// ── еден мен үстел ──
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#e4e9f0', roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.9; floor.receiveShadow = true; scene.add(floor);
const table = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.16, 2.6), new THREE.MeshStandardMaterial({ color: '#c99d6b', roughness: 0.7 }));
table.position.y = -0.08; table.receiveShadow = true; table.castShadow = true; scene.add(table);
for (const [x, z] of [[-2.4, -1.1], [2.4, -1.1], [-2.4, 1.1], [2.4, 1.1]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.74, 0.12), new THREE.MeshStandardMaterial({ color: '#a77f52', roughness: 0.8 }));
  leg.position.set(x, -0.53, z); leg.castShadow = true; scene.add(leg);
}

// ── ыдыс (шыны) және су ──
const TW = 1.5, TD = 1.0, TH = 1.45, H0 = 0.78;
const glass = new THREE.Mesh(new THREE.BoxGeometry(TW, TH, TD), new THREE.MeshPhysicalMaterial({ color: '#dfefff', transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0, depthWrite: false, side: THREE.DoubleSide }));
glass.position.y = TH / 2; glass.renderOrder = 3; scene.add(glass);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(TW, TH, TD)), new THREE.LineBasicMaterial({ color: '#9fb6cf' }));
edges.position.copy(glass.position); scene.add(edges);
const base = new THREE.Mesh(new THREE.BoxGeometry(TW + 0.04, 0.05, TD + 0.04), new THREE.MeshStandardMaterial({ color: '#b8c7d8', roughness: 0.3 }));
base.position.y = 0.025; base.receiveShadow = true; scene.add(base);
const waterMat = new THREE.MeshPhysicalMaterial({ color: '#2f8fe0', transparent: true, opacity: 0.5, roughness: 0.1, depthWrite: false });
const water = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.04, 1, TD - 0.04), waterMat);
water.renderOrder = 2; scene.add(water);
const surfGeo = new THREE.PlaneGeometry(TW - 0.04, TD - 0.04, 60, 40);
const surf = new THREE.Mesh(surfGeo, new THREE.MeshPhysicalMaterial({ color: '#7cc4ff', transparent: true, opacity: 0.55, roughness: 0.05, depthWrite: false, side: THREE.DoubleSide }));
surf.rotation.x = -Math.PI / 2; surf.renderOrder = 2; scene.add(surf);
const surfBase = surfGeo.attributes.position.array.slice();
// бастапқы су деңгейінің белгісі (ыдыстың алдыңғы қабырғасында)
const mark = (y, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.012, 0.005), new THREE.MeshBasicMaterial({ color: c })); m.position.set(TW / 2 - 0.16, y, TD / 2 + 0.004); scene.add(m); return m; };
const mark0 = mark(H0, '#1b4f8a');
const markUp = mark(H0, '#17a05d');
const band = new THREE.Mesh(new THREE.BoxGeometry(TW - 0.04, 1, TD - 0.04), new THREE.MeshBasicMaterial({ color: '#17d07a', transparent: true, opacity: 0, depthWrite: false }));
band.renderOrder = 4; scene.add(band);

// ── штатив ──
const metal = new THREE.MeshStandardMaterial({ color: '#7c8796', metalness: 0.7, roughness: 0.35 });
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.9, 24), metal); pole.position.set(-1.35, 1.95, -0.2); pole.castShadow = true; scene.add(pole);
const foot = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.06, 0.5), metal); foot.position.set(-1.35, 0.03, -0.2); foot.castShadow = true; scene.add(foot);
const arm = new THREE.Group(); scene.add(arm);
const armBar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4, 16), metal); armBar.rotation.z = Math.PI / 2; armBar.position.set(-0.68, 0, -0.2); armBar.castShadow = true; arm.add(armBar);
const clamp = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.14), metal); clamp.position.set(-1.35, 0, -0.2); arm.add(clamp);

// ── динамометр: корпус, шкала (canvas), серіппе ──
const dyn = new THREE.Group(); scene.add(dyn);
const bodyMat = new THREE.MeshStandardMaterial({ color: '#f4f6f9', roughness: 0.4 });
const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.08), bodyMat); body.castShadow = true; dyn.add(body);
const cv = document.createElement('canvas'); cv.width = 128; cv.height = 512; const cx = cv.getContext('2d');
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
const face = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.96), new THREE.MeshBasicMaterial({ map: tex })); face.position.z = 0.041; dyn.add(face);
function drawScale(F) {
  cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, 128, 512);
  cx.strokeStyle = '#1b2230'; cx.fillStyle = '#1b2230'; cx.font = 'bold 26px Arial'; cx.textAlign = 'right';
  for (let i = 0; i <= 80; i++) { const y = 30 + i * 5.6; cx.lineWidth = i % 10 ? 1.5 : 3; cx.beginPath(); cx.moveTo(78, y); cx.lineTo(i % 10 ? 100 : 112, y); cx.stroke(); if (i % 10 === 0) cx.fillText(String(i / 10), 70, y + 9); }
  const y = 30 + F * 56; // көрсеткіш
  cx.fillStyle = '#e5483a'; cx.beginPath(); cx.moveTo(114, y); cx.lineTo(126, y - 9); cx.lineTo(126, y + 9); cx.fill();
  cx.fillRect(76, y - 2, 40, 4);
  tex.needsUpdate = true;
}
const springMat = new THREE.MeshStandardMaterial({ color: '#c08a3e', metalness: 0.8, roughness: 0.3 });
let spring = null;
function makeSpring(len) {
  const turns = 14, r = 0.07, pts = [];
  for (let i = 0; i <= 400; i++) { const a = i / 400; pts.push(new THREE.Vector3(Math.cos(a * turns * 2 * Math.PI) * r, -a * len, Math.sin(a * turns * 2 * Math.PI) * r)); }
  const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 400, 0.012, 8, false);
  if (spring) { spring.geometry.dispose(); spring.geometry = g; } else { spring = new THREE.Mesh(g, springMat); spring.castShadow = true; dyn.add(spring); }
  spring.position.y = -0.5;
}
const hook = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 8, 24, Math.PI * 1.4), metal); dyn.add(hook);
const string = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 1, 6), new THREE.MeshStandardMaterial({ color: '#3a3f4a' })); dyn.add(string);

// ── тас ──
const R = 0.27;
const sg = new THREE.IcosahedronGeometry(R, 5); const p = sg.attributes.position;
for (let i = 0; i < p.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(p, i); const n = 1 + 0.08 * Math.sin(v.x * 9 + v.y * 4) * Math.cos(v.z * 8) + 0.05 * Math.sin(v.y * 15); v.multiplyScalar(n); v.y *= 0.82; p.setXYZ(i, v.x, v.y, v.z); }
sg.computeVertexNormals();
const stone = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({ color: '#8d8a84', roughness: 0.85, flatShading: false }));
stone.castShadow = true; scene.add(stone);

// ── күш бағыттамалары ──
function arrow(color) {
  const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.45, transparent: true, depthTest: false });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 16), m), head = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.18, 20), m);
  shaft.renderOrder = head.renderOrder = 9;
  g.add(shaft, head); g.userData = { shaft, head, m }; scene.add(g); return g;
}
function setArrow(a, from, len, dir, op) {
  const { shaft, head, m } = a.userData; a.visible = op > 0.01 && len > 0.02; m.opacity = op;
  const L = Math.max(0.02, len - 0.18);
  shaft.scale.y = L; shaft.position.y = dir * L / 2; head.position.y = dir * (L + 0.09); head.rotation.z = dir > 0 ? 0 : Math.PI;
  a.position.copy(from);
}
const aG = arrow('#e5483a'), aA = arrow('#17a05d'), aT = arrow('#1f6fd0');
function label(txt, sub, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128; const x = c.getContext('2d');
  x.font = 'italic bold 84px Georgia'; x.fillStyle = color; x.fillText(txt, 20, 92); const w = x.measureText(txt).width;
  if (sub) { x.font = 'italic bold 48px Georgia'; x.fillText(sub, 22 + w, 112); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false })); s.scale.set(0.5, 0.25, 1); s.renderOrder = 10; scene.add(s); return s;
}
const lG = label('mg', '', '#e5483a'), lA = label('F', 'A', '#17a05d'), lT = label('F', 'серп', '#1f6fd0');
// «бір қарағанда»: mg = F_серп + F_A теңдігін көрсететін шеңбер-нүкте
const ring = new THREE.Mesh(new THREE.RingGeometry(0.33, 0.36, 64), new THREE.MeshBasicMaterial({ color: '#17a05d', transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
ring.renderOrder = 5; scene.add(ring);

// динамометрдің ірі көрсеткіші
const rc = document.createElement('canvas'); rc.width = 512; rc.height = 160; const rx = rc.getContext('2d');
const rt = new THREE.CanvasTexture(rc); rt.colorSpace = THREE.SRGBColorSpace;
const readout = new THREE.Sprite(new THREE.SpriteMaterial({ map: rt, transparent: true, depthTest: false })); readout.scale.set(0.95, 0.3, 1); readout.renderOrder = 11; scene.add(readout);
let lastTxt = '';
function setReadout(F) {
  const txt = F.toFixed(1).replace('.', ',') + ' Н'; if (txt === lastTxt) return; lastTxt = txt;
  rx.clearRect(0, 0, 512, 160); rx.fillStyle = 'rgba(255,255,255,0.92)'; rx.beginPath(); rx.roundRect(8, 8, 496, 144, 36); rx.fill();
  rx.strokeStyle = '#1f6fd0'; rx.lineWidth = 6; rx.stroke();
  rx.fillStyle = '#1b2230'; rx.font = 'bold 96px Arial'; rx.textAlign = 'center'; rx.fillText(txt, 256, 112); rt.needsUpdate = true;
}

// ── уақыт сызығы ──
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const seg = (t, a, b) => ease((t - a) / (b - a));
const Wt = 6.0, FA = 2.4, K = 0.055; // салмағы (Н), Архимед күші (Н), серіппе ұзаруы (м/Н)
const TOP_Y = 3.2; // динамометр корпусының ортасы (тас ауада)
const LOW = 1.25;  // қанша төмен түседі

window.renderFrame = (t) => {
  t = ((t % DUR) + DUR) % DUR;
  // түсу 2.5→7.0, көтерілу 12.5→16.5
  const down = seg(t, 2.5, 7.0) * (1 - seg(t, 12.5, 16.5));
  const yBody = TOP_Y - LOW * down;
  // тастың суға батқан бөлігі (су деңгейі де көтеріледі)
  let f = 0, level = H0;
  for (let k = 0; k < 4; k++) {
    const F = Wt - FA * f, sl = 0.25 + K * F;
    const yStone = yBody - 0.5 - sl - 0.16 - R * 0.82;
    level = H0 + 0.15 * f;
    f = Math.min(1, Math.max(0, (level - (yStone - R * 0.82)) / (2 * R * 0.82)));
  }
  const F = Wt - FA * f, sl = 0.25 + K * F;
  dyn.position.set(0, yBody, 0);
  arm.position.y = yBody + 0.5 + 0.06; armBar.position.x = -0.68;
  drawScale(F); setReadout(F); readout.position.set(0.72, yBody + 0.25, 0.1);
  makeSpring(sl);
  hook.position.y = -0.5 - sl - 0.04;
  string.scale.y = 0.12; string.position.y = -0.5 - sl - 0.1;
  const ys = yBody - 0.5 - sl - 0.16 - R * 0.82;
  stone.position.set(0, ys, 0); stone.rotation.y = 0.4 + t * 0.05;
  // су
  water.scale.y = level; water.position.y = 0.05 + level / 2 - 0.025;
  const amp = 0.012 * (Math.sin(Math.PI * Math.min(1, Math.max(0, f))) + seg(t, 4.5, 6) * (1 - seg(t, 8, 10)) * 0.6);
  const pos = surfGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = surfBase[i * 3], y = surfBase[i * 3 + 1], r = Math.hypot(x, y);
    pos.setZ(i, amp * Math.sin(r * 22 - t * 7) / (1 + r * 5) + 0.003 * Math.sin(x * 9 + t * 1.3) * Math.cos(y * 7 + t));
  }
  pos.needsUpdate = true; surfGeo.computeVertexNormals();
  surf.position.y = 0.05 + level - 0.025;
  markUp.position.y = 0.05 + level - 0.025; markUp.visible = level > H0 + 0.01;
  // ығыстырылған су көлемі — жасыл жолақ
  const bandOn = seg(t, 8.0, 8.8) * (1 - seg(t, 11.6, 12.4));
  band.material.opacity = 0.28 * bandOn * (0.75 + 0.25 * Math.sin(t * 5));
  band.scale.y = Math.max(0.001, level - H0); band.position.y = 0.05 + H0 - 0.025 + (level - H0) / 2;
  // бағыттамалар: ауырлық (әрқашан), серпімділік (динамометрдің көрсеткіші), Архимед (су ішінде)
  const showF = seg(t, 0.8, 1.8) * (1 - seg(t, 16.6, 17.4));
  const S = 0.12; // 1 Н = 0.12 м
  const c = new THREE.Vector3(0, ys, 0);
  setArrow(aG, c.clone().add(new THREE.Vector3(0.0, 0, 0.36)), Wt * S, -1, showF);
  setArrow(aT, c.clone().add(new THREE.Vector3(-0.14, 0, 0.36)), F * S, 1, showF);
  setArrow(aA, c.clone().add(new THREE.Vector3(0.14, 0, 0.36)), FA * f * S, 1, showF * Math.min(1, f * 3));
  lG.position.set(0.3, ys - Wt * S + 0.05, 0.36); lG.material.opacity = showF;
  lT.position.set(-0.42, ys + F * S, 0.36); lT.material.opacity = showF;
  lA.position.set(0.42, ys + FA * f * S + 0.02, 0.36); lA.material.opacity = showF * Math.min(1, f * 3);
  ring.position.set(0, ys, 0.37); ring.material.opacity = 0.6 * seg(t, 8.0, 8.6) * (1 - seg(t, 11.4, 12.0)) * (0.6 + 0.4 * Math.sin(t * 6));
  // камера: баяу айналу, батқан кезде суға жақындау
  const zoom = seg(t, 7.2, 9.0) * (1 - seg(t, 11.0, 12.8));
  const ang = -0.55 + 0.35 * Math.sin((t / DUR) * Math.PI * 2);
  const rad = 8.6 - 2.8 * zoom, yy = 2.8 - 0.8 * zoom;
  camera.position.set(Math.sin(ang) * rad, yy, Math.cos(ang) * rad);
  camera.lookAt(0.15 * zoom, 1.8 - 0.55 * zoom, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.93);
};
window.ready = true;
</script>
</body></html>

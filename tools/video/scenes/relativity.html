<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Қозғалыстың салыстырмалылығы» (7-сынып): арба тұрақты υ жылдамдықпен жүреді, діңгектің ұшынан шар түседі.
// 1-түсу: камера үстелге (Жерге) байланған — шардың траекториясы парабола. 2-түсу: камера арбамен бірге жүреді —
// траектория тік сызық. Шар екі жағдайда да діңгектің түбіне түседі.
import { THREE, V, stage, orbit, arrow, label, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [6.2, 2.2] }), { scene, camera } = st;

const X0 = -2.6, T0 = 0.6, T1 = 17.4, VX = 5.0 / (T1 - T0); // арба 5 бірлік жол жүреді
const HM = 1.1, FALL = 1.7, G = 2 * (HM - 0.2) / FALL ** 2;   // діңгек биіктігі, түсу уақыты, «баяу» үдеу
const D1 = 3.0, D2 = 11.0;                                     // түсу басталатын уақыттар
const xc = (t) => X0 + VX * (Math.min(Math.max(t, T0), T1) - T0);
// жол (рельс)
mesh(new THREE.BoxGeometry(6.0, 0.012, 0.5), new THREE.MeshStandardMaterial({ color: '#f7f2e3', roughness: 0.9 }), { parent: scene, pos: [0, 0.006, 0] });
for (const z of [-0.14, 0.14]) mesh(new THREE.BoxGeometry(6.0, 0.02, 0.025), mat.metal, { parent: scene, pos: [0, 0.02, z] });
// арба
const cart = new THREE.Group(); scene.add(cart);
mesh(new THREE.BoxGeometry(0.8, 0.12, 0.42), new THREE.MeshStandardMaterial({ color: '#2b6be6', roughness: 0.5 }), { parent: cart, pos: [0, 0.14, 0] });
mesh(new THREE.BoxGeometry(0.76, 0.02, 0.38), new THREE.MeshStandardMaterial({ color: '#f4f6f9', roughness: 0.6 }), { parent: cart, pos: [0, 0.21, 0] });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.04, 20), mat.dark, { parent: cart, pos: [sx * 0.26, 0.06, sz * 0.17], rot: [Math.PI / 2, 0, 0] });
const MX = 0.05; // діңгектің арбадағы орны
mesh(new THREE.CylinderGeometry(0.018, 0.018, HM - 0.2, 12), mat.metal, { parent: cart, pos: [MX, 0.2 + (HM - 0.2) / 2, -0.12] });
mesh(new THREE.BoxGeometry(0.14, 0.02, 0.16), mat.metal, { parent: cart, pos: [MX, HM + 0.02, -0.06] });
const target = mesh(new THREE.RingGeometry(0.05, 0.075, 32), new THREE.MeshBasicMaterial({ color: '#e5483a' }), { parent: cart, pos: [MX, 0.222, 0], rot: [-Math.PI / 2, 0, 0], shadow: false });
// шарлар
const ballM = new THREE.MeshStandardMaterial({ color: '#e5683a', roughness: 0.35 });
const b1 = mesh(new THREE.SphereGeometry(0.05, 24, 16), ballM, { parent: scene }), b2 = mesh(new THREE.SphereGeometry(0.05, 24, 16), ballM, { parent: scene });
// шардың бастапқы орнынан бергі биіктігі (жергілікті, арбаға қатысты)
const yOf = (t, d) => { const u = Math.min(Math.max(t - d, 0), FALL); return HM - 0.05 - G * u * u / 2; };
// іздер: 1 — Жерге қатысты (сахнада), 2 — арбаға қатысты (арбада)
const NP = 26;
const dots = (parent, col) => Array.from({ length: NP }, () => { const d = mesh(new THREE.SphereGeometry(0.018, 10, 8), new THREE.MeshBasicMaterial({ color: col }), { parent, shadow: false }); d.visible = false; return d; });
const tr1 = dots(scene, '#e5483a'), tr2 = dots(cart, '#1f6fd0');
const av = arrow(scene, '#17a05d', { r: 0.02 }), lv = label(scene, 'υ', '', '#17a05d', { size: 0.34 });

window.renderFrame = (t) => {
  const x = xc(t); cart.position.x = x;
  // 1-шар: D1-ге дейін діңгекте, сосын түседі, сосын арбада қалады
  const p1 = (tt) => V(xc(tt) + MX, yOf(tt, D1), 0);
  b1.position.copy(p1(t)); if (t > D1 + FALL) b1.position.set(x + MX + 0.1, 0.27, 0.08);
  b2.visible = t > D1 + FALL + 0.6; // екінші шар діңгекке қойылады
  b2.position.set(x + MX, yOf(t, D2), 0);
  tr1.forEach((d, i) => { const tt = D1 + FALL * i / (NP - 1); d.visible = t >= tt && t < 10.2; d.position.copy(p1(tt)); });
  tr2.forEach((d, i) => { const tt = D2 + FALL * i / (NP - 1); d.visible = t >= tt; d.position.set(MX, yOf(tt, D2), 0); });
  // жылдамдық бағыты
  const on = win(t, 0.8, 1.3, 17.0, 17.6);
  av.set(V(x + 0.45, 0.32, 0.2), V(1, 0, 0), 0.5, on); lv.show(V(x + 0.75, 0.48, 0.2), on);
  
  // камера: 1-бөлім Жерде тұрады, 2-бөлім арбамен бірге
  const k = seg(t, 7.0, 9.5), lookX = lerp(-1.2, x, k);
  orbit(camera, t, { ang: lerp(-0.2, 0.35, k), swing: 0.08, rad: lerp(4.4, 3.0, k), y: lerp(1.6, 1.5, k), look: [lookX, 0.6, 0], cx: lookX });
  return st.render();
};
ready();
</script>
</body></html>

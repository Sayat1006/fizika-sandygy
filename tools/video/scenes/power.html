<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Механикалық жұмыс және қуат» (7-сынып): екі шығыр бірдей жүкті (F = 20 Н) бірдей h = 1,2 м биіктікке көтереді.
// Жұмыстары тең: A = Fh = 24 Дж. Біріншісі t₁ = 4 с, екіншісі t₂ = 8 с жұмсайды: N₁ = 6 Вт, N₂ = 3 Вт.
import { THREE, V, stage, orbit, arrow, label, readout, ruler, seg, win, lerp, mat, mesh, num, ready } from './kit.js';
const st = stage({ table: [4.6, 2.2] }), { scene, camera } = st;

const H = 1.2, TOP = 1.75, T0 = 2.0, D = [4, 8], XS = [-0.75, 0.75], COL = ['#e5483a', '#1f6fd0'];
const units = XS.map((x, i) => {
  // рама
  for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(0.06, TOP + 0.1, 0.06), mat.metal, { parent: scene, pos: [x + s * 0.32, (TOP + 0.1) / 2, -0.25] });
  mesh(new THREE.BoxGeometry(0.76, 0.06, 0.06), mat.metal, { parent: scene, pos: [x, TOP + 0.1, -0.25] });
  // шығыр барабаны + мотор
  const drum = new THREE.Group(); drum.position.set(x, TOP, 0); scene.add(drum);
  mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.36, 28), new THREE.MeshStandardMaterial({ color: '#c08a3e', metalness: 0.6, roughness: 0.35 }), { parent: drum, rot: [Math.PI / 2, 0, 0] });
  for (const z of [-0.19, 0.19]) mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.02, 28), mat.dark, { parent: drum, pos: [0, 0, z], rot: [Math.PI / 2, 0, 0] });
  mesh(new THREE.BoxGeometry(0.06, 0.2, 0.02), mat.white, { parent: drum, pos: [0, 0.06, 0.205] }); // айналысты көрсететін белгі
  mesh(new THREE.BoxGeometry(0.06, 0.06, 0.25), mat.metal, { parent: scene, pos: [x, TOP, -0.13] });
  mesh(new THREE.BoxGeometry(0.26, 0.24, 0.24), new THREE.MeshStandardMaterial({ color: COL[i], roughness: 0.5 }), { parent: scene, pos: [x, TOP + 0.02, -0.25 - 0.14] });
  const rope = mesh(new THREE.CylinderGeometry(0.006, 0.006, 1, 8), mat.dark, { parent: scene, shadow: false });
  const load = new THREE.Group(); scene.add(load);
  mesh(new THREE.BoxGeometry(0.26, 0.22, 0.22), new THREE.MeshStandardMaterial({ color: '#9aa4b2', metalness: 0.3, roughness: 0.45 }), { parent: load, pos: [0, 0.11, 0] });
  mesh(new THREE.TorusGeometry(0.03, 0.008, 8, 20), mat.metal, { parent: load, pos: [0, 0.25, 0] });
  const timer = readout(scene, { color: COL[i], w: 0.66 }), rN = readout(scene, { color: COL[i], w: 0.76 });
  return { x, drum, rope, load, timer, rN, d: D[i] };
});
const rl = ruler(scene, { len: H, n: 12, every: 2, width: 0.12, text: (k) => num((12 - k) / 10, 1) }); rl.position.set(0, H / 2 + 0.1, -0.2);
const lh = label(scene, 'h', '', '#17a05d', { size: 0.32 });
const rA = readout(scene, { color: '#17a05d', w: 0.82 });
const aF = arrow(scene, '#1b2230', { r: 0.016 }), lF = label(scene, 'F', '', '#1b2230', { size: 0.3 });

window.renderFrame = (t) => {
  for (const u of units) {
    const k = Math.min(1, Math.max(0, (t - T0) / u.d)), y = 0.0 + H * k;
    u.load.position.set(u.x, y, 0);
    u.drum.rotation.z = -k * H / 0.08;
    const ropeTop = TOP - 0.08, ropeBot = y + 0.28; u.rope.scale.y = ropeTop - ropeBot; u.rope.position.set(u.x + 0.08, (ropeTop + ropeBot) / 2, 0);
    const tt = Math.min(u.d, Math.max(0, t - T0));
    u.timer.set('t = ' + num(tt) + ' с', win(t, 1.0, 1.5, 17.2, 17.8)); u.timer.position.set(u.x, TOP + 0.36, 0.1);
    u.rN.set('N = ' + (u.d === 4 ? '6' : '3') + ' Вт', win(t, 12.0 + (u.d === 4 ? 0 : 0.8), 12.5 + (u.d === 4 ? 0 : 0.8), 17.2, 17.8)); u.rN.position.set(u.x, 0.62, 0.45);
  }
  const fo = win(t, 2.4, 2.9, 10.0, 10.6), y0 = units[0].load.position.y;
  aF.set(V(XS[0] - 0.2, y0 + 0.11, 0.15), V(0, 1, 0), 0.4, fo); lF.show(V(XS[0] - 0.38, y0 + 0.4, 0.15), fo);
  lh.show(V(0.15, H / 2 + 0.1, 0.05), seg(t, 6.0, 6.5) * (1 - seg(t, 17.2, 17.8)));
  rA.set('A = 24 Дж', win(t, 10.4, 10.9, 17.2, 17.8)); rA.position.set(0, TOP + 0.62, 0.1);
  orbit(camera, t, { ang: -0.1, swing: 0.22, rad: 5.4, y: 1.7, look: [0, 1.15, 0] });
  return st.render();
};
ready();
</script>
</body></html>

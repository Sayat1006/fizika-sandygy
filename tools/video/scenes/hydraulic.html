<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Гидравликалық машина» (7-сынып): кіші поршеньге F₁ = 20 Н, үлкенінде F₂ = 180 Н (S₂ = 9S₁);
// кіші поршень 0,6 бірлік түседі — үлкені 9 есе аз көтеріледі, жүкті көтереді.
import { THREE, V, stage, orbit, arrow, label, readout, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [4.4, 2.2] }), { scene, camera } = st;

const R1 = 0.1, R2 = 0.3, K = (R2 / R1) ** 2, X1 = -0.9, X2 = 0.6, YB = 0.25, H = 1.2, L0 = 0.95; // L0 — бастапқы деңгей
const oil = new THREE.MeshPhysicalMaterial({ color: '#e8b33d', transparent: true, opacity: 0.6, roughness: 0.2, depthWrite: false });
const glass = (r, h, x, y) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 40, 1, true), mat.glass()); m.position.set(x, y, 0); m.renderOrder = 3; scene.add(m); return m; };
glass(R1 + 0.01, H, X1, YB + H / 2); glass(R2 + 0.01, H, X2, YB + H / 2);
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, X2 - X1, 20, 1, true), mat.glass()); pipe.rotation.z = Math.PI / 2; pipe.position.set((X1 + X2) / 2, YB, 0); pipe.renderOrder = 3; scene.add(pipe);
const pipeOil = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, X2 - X1, 20), oil); pipeOil.rotation.z = Math.PI / 2; pipeOil.position.copy(pipe.position); scene.add(pipeOil);
mesh(new THREE.BoxGeometry(2.4, 0.06, 0.8), mat.woodDark, { parent: scene, pos: [(X1 + X2) / 2, 0.03, 0] });
for (const x of [X1, X2]) mesh(new THREE.CylinderGeometry(0.03, 0.03, YB - 0.06, 10), mat.metal, { parent: scene, pos: [x, (YB + 0.06) / 2, 0] });
const col = (r, x) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r - 0.006, r - 0.006, 1, 40), oil); m.position.x = x; m.renderOrder = 2; scene.add(m); return m; };
const c1 = col(R1, X1), c2 = col(R2, X2);
const piston = (r) => mesh(new THREE.CylinderGeometry(r - 0.004, r - 0.004, 0.06, 40), mat.dark, { parent: scene });
const p1 = piston(R1), p2 = piston(R2);
const rod = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 12), mat.metal, { parent: scene }); const knob = mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 20), mat.dark, { parent: scene });
const load = mesh(new THREE.BoxGeometry(0.42, 0.24, 0.34), new THREE.MeshStandardMaterial({ color: '#9aa4b2', metalness: 0.3, roughness: 0.4 }), { parent: scene });
const glowM = new THREE.MeshBasicMaterial({ color: '#17d07a', transparent: true, opacity: 0, depthTest: false });
const g1 = mesh(new THREE.CircleGeometry(R1, 40), glowM, { parent: scene, rot: [-Math.PI / 2, 0, 0], shadow: false }), g2 = mesh(new THREE.CircleGeometry(R2, 40), glowM, { parent: scene, rot: [-Math.PI / 2, 0, 0], shadow: false });
g1.renderOrder = g2.renderOrder = 9;
const a1 = arrow(scene, '#e5483a', { r: 0.022 }), a2 = arrow(scene, '#1f6fd0', { r: 0.04 });
const l1 = label(scene, 'F', '1', '#e5483a', { size: 0.36 }), l2 = label(scene, 'F', '2', '#1f6fd0', { size: 0.36 });
const s1 = label(scene, 'S', '1', '#0f8a52', { size: 0.34 }), s2 = label(scene, 'S', '2', '#0f8a52', { size: 0.34 });
const r1 = readout(scene, { color: '#e5483a', w: 0.52 }), r2 = readout(scene, { color: '#1f6fd0', w: 0.56 });
const DROP = 0.6;

window.renderFrame = (t) => {
  const k = seg(t, 2.6, 8.2) + seg(t, 12.2, 15.6) * 0.6; // екі рет басу (барлығы 0,6 бірлік)
  const y1 = YB + L0 - DROP * Math.min(k, 1.6) / 1.6 * 1.0, y2 = YB + L0 + DROP * Math.min(k, 1.6) / 1.6 / K;
  c1.scale.y = y1 - YB; c1.position.y = (y1 + YB) / 2; c2.scale.y = y2 - YB; c2.position.y = (y2 + YB) / 2;
  p1.position.set(X1, y1 + 0.03, 0); p2.position.set(X2, y2 + 0.03, 0);
  rod.position.set(X1, y1 + 0.31, 0); knob.position.set(X1, y1 + 0.58, 0); load.position.set(X2, y2 + 0.18, 0);
  const on = win(t, 2.2, 2.8, 16.8, 17.5);
  a1.set(V(X1, y1 + 1.05, 0.16), V(0, -1, 0), 0.4, on); l1.show(V(X1 - 0.2, y1 + 0.95, 0.16), on);
  a2.set(V(X2 + 0.36, y2 + 0.06, 0), V(0, 1, 0), 0.75, on); l2.show(V(X2 + 0.56, y2 + 0.72, 0), on);
  r1.set('20 Н', on); r1.position.set(X1 - 0.5, y1 + 0.75, 0.1); r2.set('180 Н', on); r2.position.set(X2 + 0.95, y2 + 0.4, 0.1);
  const so = win(t, 8.8, 9.4, 11.8, 12.3); glowM.opacity = 0.6 * so; g1.position.set(X1, y1 + 0.065, 0); g2.position.set(X2, y2 + 0.065, 0); g1.visible = g2.visible = so > 0.01;
  s1.show(V(X1 - 0.24, y1 + 0.08, 0.14), so); s2.show(V(X2 - 0.48, y2 + 0.08, 0.3), so);
  orbit(camera, t, { ang: -0.15, swing: 0.3, rad: 4.8, y: 2.0, look: [-0.05, 1.05, 0] });
  return st.render();
};
ready();
</script>
</body></html>

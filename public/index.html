<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Физика Сандығы</title>
<meta name="description" content="Физика пәні мұғалімдеріне: ҚМЖ мен презентациялар ҚТЖ бойынша апта сайын жеке кабинетте. 7–11-сынып, 2026–2027 оқу жылы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: one centered column of open editorial sections, white and #F5F5F7 alternating; cards only for the order panel. */
:root {
  --bg: #FFFFFF;
  --bg-2: #F5F5F7;
  --fg: #1D1D1F;
  --fg-2: #6E6E73;
  --fg-3: #86868B;
  --accent: #0071E3;
  --accent-hover: #0077ED;
  --on-accent: #FFFFFF;
  --line: #E8E8ED;
  --ok: #248A3D;
  --warn: #B25000;
  --warn-bg: #FFF4E5;
  --nav: rgba(255, 255, 255, 0.78);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -12px rgba(0, 0, 0, .12);
  --display: 'Manrope', 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif;
  --text: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.25, .1, .25, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg-2: #161617; --fg: #F5F5F7; --fg-2: #A1A1A6; --fg-3: #86868B; --accent: #2997FF; --accent-hover: #47A6FF; --on-accent: #FFFFFF;
  --line: #2C2C2E; --ok: #30D158; --warn: #FF9F0A; --warn-bg: #2A1F0E; --nav: rgba(22, 22, 23, 0.78); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --bg-2: #161617; --fg: #F5F5F7; --fg-2: #A1A1A6; --fg-3: #86868B; --accent: #2997FF; --accent-hover: #47A6FF; --on-accent: #FFFFFF;
  --line: #2C2C2E; --ok: #30D158; --warn: #FF9F0A; --warn-bg: #2A1F0E; --nav: rgba(22, 22, 23, 0.78); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; height: auto; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: clamp(15px, 1.05vw + 10px, 17px); line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.003em; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.025em; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 760px; }
.center { text-align: center; }
.h-section { font-size: clamp(30px, 4.4vw, 52px); font-weight: 700; line-height: 1.08; }
.h-sub { font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; line-height: 1.2; }
.kicker { font-size: clamp(17px, 1.6vw, 21px); color: var(--fg-2); line-height: 1.45; max-width: 40ch; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--fg-3); letter-spacing: .01em; }
section { padding-block: clamp(72px, 10vw, 128px); }
.alt { background: var(--bg-2); }

/* nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--nav); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.nav .wrap { height: 52px; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--fg); font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.brand:hover { text-decoration: none; }
.brand svg { width: 20px; height: 20px; }
.links { display: flex; gap: 26px; margin-left: auto; }
.links a { color: var(--fg-2); font-size: 13.5px; transition: color .2s var(--ease); }
.links a:hover { color: var(--fg); text-decoration: none; }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--fg-2); font: 600 12px var(--text); padding: 5px 10px; border-radius: 999px; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease); min-height: 28px; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px var(--text); background: var(--accent); color: var(--on-accent); padding: 7px 16px; border-radius: 999px; border: 0; cursor: pointer; transition: background .2s var(--ease); white-space: nowrap; }
.pill:hover { background: var(--accent-hover); text-decoration: none; }
.pill.lg { font-size: 17px; padding: 12px 24px; min-height: 48px; }
.pill.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pill.ghost:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.more { font-size: 17px; display: inline-flex; align-items: center; gap: 4px; min-height: 48px; }
.more::after { content: "›"; font-size: 1.2em; line-height: 1; transition: transform .2s var(--ease); }
.more:hover::after { transform: translateX(3px); }
.burger { display: none; margin-left: auto; width: 40px; height: 40px; border: 0; background: transparent; color: var(--fg); cursor: pointer; border-radius: 8px; }
.burger svg { width: 18px; height: 18px; }
.mmenu { display: none; }
@media (max-width: 760px) {
  .links, .nav .pill { display: none; }
  .burger { display: inline-grid; place-items: center; margin-left: 0; }
  .seg { margin-left: auto; }
  .mmenu { display: grid; overflow: hidden; max-height: 0; transition: max-height .35s var(--ease); background: var(--bg); }
  .mmenu.open { max-height: 360px; border-bottom: 1px solid var(--line); }
  .mmenu a { color: var(--fg); font: 600 22px var(--display); padding: 12px 0; border-bottom: 1px solid var(--line); }
  .mmenu .wrap { display: grid; padding-block: 8px 20px; }
}

/* hero */
.hero { padding-block: clamp(56px, 8vw, 96px) 0; text-align: center; overflow: hidden; }
.hero .eyebrow { color: var(--accent); font-size: clamp(15px, 1.4vw, 19px); }
.hero h1 { font-size: clamp(40px, 7.4vw, 86px); font-weight: 800; line-height: 1.03; letter-spacing: -0.035em; margin: 14px auto 18px; max-width: 13ch; }
.hero .kicker { margin: 0 auto; }
.hero-cta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 28px; margin-top: 28px; }
.stage { position: relative; height: clamp(300px, 46vw, 500px); margin-top: 24px; }
#atom { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.atom-fallback { position: absolute; inset: 0; display: grid; place-items: center; }
.atom-fallback svg { width: min(60%, 340px); height: auto; color: var(--fg-3); }
.atom-fallback[hidden] { display: none; }
.rise { animation: rise .6s var(--ease) both; }
.rise.d1 { animation-delay: .06s; } .rise.d2 { animation-delay: .12s; } .rise.d3 { animation-delay: .18s; }
@keyframes rise { from { opacity: .35; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* figures */
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; text-align: center; border-top: 1px solid var(--line); padding-top: 48px; margin-top: 8px; }
.figures b { display: block; font: 800 clamp(34px, 6vw, 64px)/1 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.figures span { color: var(--fg-2); font-size: 15px; display: block; margin-top: 8px; }
@media (max-width: 520px) { .figures { gap: 12px; padding-top: 36px; } .figures span { font-size: 13px; } }

/* inside: editorial rows */
.rows { display: grid; gap: clamp(64px, 9vw, 112px); margin-top: clamp(48px, 7vw, 80px); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
.row:nth-child(even) .shot { order: 2; }
.shot { background: var(--bg); border-radius: 18px; padding: clamp(14px, 2vw, 22px); box-shadow: var(--shadow); max-width: 100%; }
.alt .shot { background: var(--bg); }
.shot img { display: block; width: 100%; border-radius: 8px; }
.row .copy { display: grid; gap: 14px; min-width: 0; }
.row .fmt { font-size: 13px; font-weight: 600; color: var(--fg-3); letter-spacing: .04em; }
.row ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; color: var(--fg-2); }
.row li { padding-left: 22px; position: relative; }
.row li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); }
@media (max-width: 760px) { .row { grid-template-columns: 1fr; } .row:nth-child(even) .shot { order: 0; } }

/* catalogue */
.segbar { display: flex; justify-content: center; margin: 36px 0 44px; }
.tabs { display: inline-flex; background: var(--bg-2); border-radius: 12px; padding: 3px; max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: transparent; color: var(--fg-2); font: 500 15px var(--text); padding: 9px 18px; border-radius: 10px; cursor: pointer; white-space: nowrap; min-height: 40px; transition: background .25s var(--ease), color .25s var(--ease); }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .1); }
.catalog { display: grid; grid-template-columns: 260px 1fr; gap: clamp(28px, 5vw, 64px); align-items: start; }
.cover img { width: 100%; border-radius: 10px; box-shadow: var(--shadow); display: block; }
.cover .ph { aspect-ratio: 210 / 297; border-radius: 10px; background: var(--bg-2); display: grid; place-items: center; text-align: center; font: 800 28px/1.15 var(--display); letter-spacing: -0.03em; }
.cover .ph small { display: block; font: 500 15px var(--text); color: var(--fg-2); letter-spacing: 0; margin-top: 6px; }
.list { border-top: 1px solid var(--line); min-width: 0; }
.item { display: grid; grid-template-columns: 24px 1fr auto; gap: 16px; align-items: center; padding: 20px 4px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .2s var(--ease); }
.item:hover { background: color-mix(in srgb, var(--bg-2) 60%, transparent); }
.item input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fg-3); margin: 0; display: grid; place-items: center; cursor: pointer; transition: background .2s var(--ease), border-color .2s var(--ease); }
.item input:checked { background: var(--accent); border-color: var(--accent); }
.item input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.item .nm { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.item .ds { color: var(--fg-2); font-size: 14px; margin-top: 2px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 2px; }
.price { font: 600 17px var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.price s { color: var(--fg-3); font-weight: 400; font-size: 14px; margin-right: 8px; }
.full { margin-top: 40px; padding: clamp(24px, 4vw, 36px); border-radius: 22px; background: var(--bg-2); display: grid; grid-template-columns: 24px 1fr auto; gap: 18px; align-items: center; cursor: pointer; }
.full input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--fg-3); margin: 0; display: grid; place-items: center; cursor: pointer; }
.full input:checked { background: var(--accent); border-color: var(--accent); }
.full input:checked::after { content: ""; width: 6px; height: 12px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.full .nm { font: 700 clamp(20px, 2.2vw, 26px) var(--display); letter-spacing: -0.02em; }
.full .ds { color: var(--fg-2); margin-top: 4px; }
.full .price { font-size: clamp(20px, 2.4vw, 28px); font-weight: 700; }
@media (max-width: 760px) { .catalog { grid-template-columns: 1fr; } .cover { max-width: 200px; margin: 0 auto; } .full { grid-template-columns: 24px 1fr; } .full .price { grid-column: 2; text-align: left; } }

/* steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 56px; }
.step { display: grid; gap: 8px; align-content: start; }
.step .n { font: 700 15px var(--display); color: var(--accent); }
.step h3 { font-size: 21px; font-weight: 700; }
.step p { color: var(--fg-2); font-size: 15px; }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .steps { grid-template-columns: 1fr; gap: 24px; } }

/* order */
.order { display: grid; grid-template-columns: 1.15fr .85fr; gap: 24px; margin-top: 64px; align-items: start; }
.card { background: var(--bg); border-radius: 22px; padding: clamp(22px, 3vw, 32px); box-shadow: var(--shadow); display: grid; gap: 18px; min-width: 0; }
.cart { display: grid; }
.cart .r { display: flex; justify-content: space-between; gap: 16px; padding-block: 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
.cart .r span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cart .empty { color: var(--fg-2); font-size: 15px; padding-block: 8px; }
.total { display: flex; justify-content: space-between; align-items: baseline; }
.total span:first-child { font-weight: 600; }
.total .sum { font: 700 30px var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.lbl { font-size: 13px; color: var(--fg-2); font-weight: 500; }
textarea { width: 100%; min-height: 136px; font: 14px/1.55 var(--text); color: var(--fg); background: var(--bg-2); border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; resize: vertical; transition: border-color .2s var(--ease); }
textarea:focus { outline: none; border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .pill { flex: 1 1 180px; font-size: 15px; padding: 11px 18px; min-height: 44px; }
.contacts { display: grid; }
.c { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.c:first-child { padding-top: 0; }
.c .k { font-size: 13px; color: var(--fg-2); }
.c .v { font-weight: 600; font-size: 17px; user-select: all; font-variant-numeric: tabular-nums; word-break: break-all; }
.textbtn { border: 0; background: transparent; color: var(--accent); font: 500 15px var(--text); cursor: pointer; padding: 8px 4px; min-height: 40px; }
.textbtn:hover { text-decoration: underline; }
.note { color: var(--fg-2); font-size: 14px; }
@media (max-width: 860px) { .order { grid-template-columns: 1fr; } }

/* faq */
.faq { margin-top: 48px; border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 2px; font: 600 clamp(17px, 1.6vw, 19px) var(--text); letter-spacing: -0.01em; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font: 300 26px/1 var(--text); color: var(--fg-3); transition: transform .3s var(--ease); flex: none; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { color: var(--fg-2); padding: 0 2px 24px; max-width: 64ch; }

footer { background: var(--bg-2); color: var(--fg-3); font-size: 12px; }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; border-top: 1px solid var(--line); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 14px; font-weight: 500; padding: 11px 18px; border-radius: 999px; transition: opacity .25s var(--ease), transform .25s var(--ease); z-index: 80; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .rise { animation: none; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}

/* pricing */
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 760px; margin: 48px auto 0; }
.plan { background: var(--bg-2); border-radius: 22px; padding: clamp(24px, 3vw, 34px); display: grid; gap: 10px; align-content: start; }
.plan.best { box-shadow: inset 0 0 0 2px var(--accent); }
.pl-n { font: 700 19px var(--display); letter-spacing: -0.01em; }
.pl-p b { font: 800 clamp(36px, 5vw, 48px)/1 var(--display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.pl-p span { color: var(--fg-2); margin-left: 6px; }
.plan p { color: var(--fg-2); font-size: 15px; }
.badge { display: inline-block; font: 600 12px var(--text); color: var(--warn); background: var(--warn-bg); padding: 2px 8px; border-radius: 999px; vertical-align: 3px; }
.grades { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 900px; margin: 36px auto 0; border-top: 1px solid var(--line); padding-top: 28px; text-align: center; }
.gr b { display: block; font: 700 18px var(--display); }
.gr span { color: var(--fg-2); font-size: 13.5px; }
.hint-c { margin-top: 32px; color: var(--fg-2); }
@media (max-width: 680px) { .plans { grid-template-columns: 1fr; } .grades { grid-template-columns: 1fr 1fr; text-align: left; } }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Физика Сандығы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="3.8"/><ellipse cx="12" cy="12" rx="10" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="3.8" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg>
      Физика Сандығы
    </a>
    <nav class="links" aria-label="Мәзір">
      <a href="/samples" data-i="nav0"></a><a href="#inside" data-i="nav1"></a><a href="#price" data-i="nav2"></a><a href="#faq" data-i="nav4"></a>
    </nav>
    <div class="seg" role="group" aria-label="Тіл / Язык">
      <button id="lang-kk" type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
      <button id="lang-ru" type="button" data-lang="ru" aria-pressed="false">РУС</button>
    </div>
    <a class="pill" href="/app" data-i="navcta"></a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="mmenu" aria-label="Мәзір">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6h14M2 12h14"/></svg>
    </button>
  </div>
  <div class="mmenu" id="mmenu"><div class="wrap">
    <a href="/samples" data-i="nav0"></a><a href="#inside" data-i="nav1"></a><a href="#price" data-i="nav2"></a><a href="#how" data-i="nav3"></a><a href="#faq" data-i="nav4"></a><a href="/app" data-i="navcta"></a>
  </div></div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow rise" data-i="eyebrow"></p>
      <h1 class="rise d1" data-i="h1"></h1>
      <p class="kicker rise d2" data-i="lead"></p>
      <div class="hero-cta rise d3">
        <a class="pill lg" href="/samples" data-i="cta0"></a>
        <a class="more" href="/app" data-i="cta1"></a>
      </div>
    </div>
    <div class="stage" aria-hidden="true">
      <canvas id="atom"></canvas>
      <div class="atom-fallback" id="atom-fallback" hidden>
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="100" cy="100" rx="88" ry="32"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(60 100 100)"/><ellipse cx="100" cy="100" rx="88" ry="32" transform="rotate(120 100 100)"/><circle cx="100" cy="100" r="14" fill="var(--accent)" stroke="none"/></svg>
      </div>
    </div>
    <div class="wrap">
      <div class="figures">

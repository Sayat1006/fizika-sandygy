<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f7;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script></head>
<body>
<script type="module">
// «Ауырлық күші және салмақ» (7-сынып): 1) шар еркін түседі — оған тек ауырлық күші mg әсер етеді;
// 2) брусок (m = 200 г) иілгіш тақтайға қойылады — тақтай иіледі: mg денеге (центрінен), P тірекке (астынан);
// 3) брусок динамометрге ілінеді — P = mg = 2 Н, P ілгекке түседі.
import { THREE, V, stage, orbit, stand, dynamometer, arrow, label, readout, seg, win, lerp, mat, mesh, ready } from './kit.js';
const st = stage({ table: [5.0, 2.2] }), { scene, camera } = st;

// 1) еркін түсу (сол жақта)
const XB = -1.7, HB = 1.55;
const sd0 = stand(scene, { x: XB - 0.55, z: 0, h: 1.9, arm: 0.65 }); sd0.setArmY(HB + 0.08);
const ball = mesh(new THREE.SphereGeometry(0.08, 28, 20), new THREE.MeshStandardMaterial({ color: '#e5683a', roughness: 0.35 }), { parent: scene });
const TD = 1.3, TF = Math.sqrt(2 * (HB - 0.08) / 2.2); // «баяу» түсу (g' = 2,2)
// 2) иілгіш тақтай
const XP = 0.0, LP = 1.1;
for (const s of [-1, 1]) mesh(new THREE.BoxGeometry(0.14, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: '#c3cad4', roughness: 0.7 }), { parent: scene, pos: [XP + s * (LP / 2 - 0.02), 0.2, 0] });
const plankG = new THREE.BoxGeometry(LP + 0.1, 0.025, 0.36, 40, 1, 1), P0 = plankG.attributes.position.array.slice();
const plank = mesh(plankG, new THREE.MeshStandardMaterial({ color: '#e6d3b0', roughness: 0.8 }), { parent: scene, pos: [XP, 0.4125, 0] });
const sagAt = (x, s) => { const u = Math.min(1, Math.abs(x) / (LP / 2)); return -s * (1 - u * u); };
const blkM = new THREE.MeshStandardMaterial({ color: '#5b8def', roughness: 0.55 });
const blk = new THREE.Group(); scene.add(blk);
mesh(new THREE.BoxGeometry(0.3, 0.18, 0.2), blkM, { parent: blk, pos: [0, 0.09, 0] });
mesh(new THREE.TorusGeometry(0.035, 0.008, 8, 20), mat.metal, { parent: blk, pos: [0, 0.215, 0] });
// 3) динамометр (оң жақта)
const XD = 1.55;
const sd = stand(scene, { x: XD - 0.6, z: -0.1, h: 2.2, arm: 0.7 }); sd.setArmY(2.0);
const dyn = dynamometer(scene, { max: 4, K: 0.06 }); dyn.scale.setScalar(0.8); dyn.position.set(XD, 1.55, -0.1);
const thread = mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 6), mat.dark, { parent: scene, shadow: false });

const aG = arrow(scene, '#e5483a', { r: 0.02 }), lG = label(scene, 'mg', '', '#e5483a', { size: 0.34 });
const aP = arrow(scene, '#1f6fd0', { r: 0.02 }), lP = label(scene, 'P', '', '#1f6fd0', { size: 0.34 });
const rm = readout(scene, { color: '#1b2230', w: 0.6 }), rF = readout(scene, { color: '#1f6fd0', w: 0.6 });
const FS = 0.22; // 1 Н = 0,22 бірлік

window.renderFrame = (t) => {
  // 1) шар
  const u = Math.max(0, t - TD), yb = u < TF ? HB - 1.1 * u * u : 0.08;
  ball.position.set(XB, yb, 0.1); ball.visible = t < 5.4;
  const o1 = win(t, 0.6, 1.1, 4.6, 5.2);
  aG.set(V(XB, yb, 0.22), V(0, -1, 0), 0.44, o1); lG.show(V(XB + 0.24, yb - 0.3, 0.22), o1);
  // 2) брусок тақтайға → динамометрге
  const kOn = seg(t, 5.0, 6.4), sag = 0.07 * seg(t, 6.0, 6.8) * (1 - seg(t, 11.2, 11.9));
  const pa = plankG.attributes.position.array;
  for (let i = 0; i < pa.length; i += 3) pa[i + 1] = P0[i + 1] + sagAt(P0[i], sag); plankG.attributes.position.needsUpdate = true;
  const onPlank = V(XP, 0.425 - sag, 0), start = V(XP - 0.7, 0.0, 0.75);
  const hang = (F) => { const hy = dyn.set(F) * 0.8; return V(XD, 1.55 + hy - 0.32, -0.1); };
  const kHang = seg(t, 11.2, 12.6), F = 2 * seg(t, 12.4, 13.2);
  const hp = hang(F);
  let bp;
  if (kHang <= 0) { bp = start.clone().lerp(onPlank, kOn); bp.y += Math.sin(Math.PI * kOn) * 0.35; }
  else { bp = onPlank.clone().lerp(hp, kHang); bp.y += Math.sin(Math.PI * kHang) * 0.4; }
  blk.position.copy(bp); blk.position.y = Math.max(bp.y, kHang > 0 ? bp.y : 0.0); blk.visible = t > 4.6;
  if (kHang <= 0 && kOn <= 0) blk.position.y = 0.0;
  thread.visible = kHang > 0.98; thread.scale.y = 0.12; thread.position.set(XD, hp.y + 0.27, -0.1);
  // күштер
  const o2 = win(t, 7.0, 7.5, 10.6, 11.2), o3 = win(t, 13.4, 13.9, 17.2, 17.8);
  if (o2 > 0.01) {
    aG.set(V(XP + 0.1, bp.y + 0.09, 0.14), V(0, -1, 0), 2 * FS, o2); lG.show(V(XP + 0.32, bp.y - 0.12, 0.14), o2);
    aP.set(V(XP - 0.08, onPlank.y - 0.02, 0.2), V(0, -1, 0), 2 * FS, o2); lP.show(V(XP - 0.26, onPlank.y - 0.3, 0.2), o2);
  } else if (o3 > 0.01) {
    aG.set(V(XD + 0.08, bp.y + 0.09, 0.05), V(0, -1, 0), 2 * FS, o3); lG.show(V(XD + 0.3, bp.y - 0.12, 0.05), o3);
    aP.set(V(XD - 0.04, hp.y + 0.3, 0.06), V(0, -1, 0), 2 * FS, o3); lP.show(V(XD - 0.24, hp.y + 0.12, 0.06), o3);
  } else aP.set(V(0, 0, 0), V(0, -1, 0), 0, 0), lP.show(V(0, 0, 0), 0);
  rm.set('m = 200 г', win(t, 5.6, 6.2, 17.2, 17.8)); rm.position.copy(bp.clone().add(kHang > 0.5 ? V(-0.6, 0.1, 0.1) : V(0, 0.42, 0.1)));
  rF.set('2 Н', win(t, 13.0, 13.5, 17.2, 17.8)); rF.position.set(XD + 0.55, 1.75, 0);
  // камера
  const k1 = seg(t, 4.4, 6.0), k2 = seg(t, 10.8, 12.6);
  const lx = lerp(lerp(XB + 0.2, XP, k1), XD - 0.1, k2), ly = lerp(lerp(0.72, 0.55, k1), 1.2, k2);
  orbit(camera, t, { ang: -0.1, swing: 0.15, rad: lerp(lerp(4.2, 3.2, k1), 3.9, k2), y: lerp(lerp(1.4, 1.3, k1), 1.6, k2), look: [lx, ly, 0], cx: lx });
  return st.render();
};
ready();
</script>
</body></html>
